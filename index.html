<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نظام الحضور — لوحة التحكم</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f3b5f'/%3E%3Cpath d='M16 7a7 7 0 0 0-7 7c0 5 7 11 7 11s7-6 7-11a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z' fill='%23f2a900'/%3E%3C/svg%3E" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
/* NEP Site Attendance — admin dashboard */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #18212b;
  --ink-2: #3b4652;
  --muted: #6b7682;
  --line: #e3e7ec;
  --brand: #0f3b5f;
  --brand-2: #164e7c;
  --brand-ink: #e8f0f7;
  --accent: #f2a900;
  --ok: #15803d;
  --ok-bg: #e7f6ec;
  --warn: #b45309;
  --warn-bg: #fdf3e2;
  --bad: #c62828;
  --bad-bg: #fdecec;
  --info: #1d5fa8;
  --info-bg: #e8f1fb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 20px 40px rgba(16, 24, 40, .18);
  --font: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }

/* ---------- boot ---------- */
.boot { display: grid; place-items: center; min-height: 100vh; }
.boot-spinner, .spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--brand);
  animation: spin .8s linear infinite;
}
.spinner { width: 18px; height: 18px; border-width: 2px; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- auth screens ---------- */
.auth-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background:
    radial-gradient(1200px 600px at 100% 0%, rgba(242,169,0,.10), transparent 60%),
    linear-gradient(160deg, #0b2c47 0%, #0f3b5f 55%, #164e7c 100%);
}
.auth-card {
  width: 100%; max-width: 400px; background: var(--surface); border-radius: 16px;
  padding: 32px 28px; box-shadow: var(--shadow-lg);
}
.auth-card h1 { font-size: 20px; margin: 14px 0 4px; }
.auth-card p { margin: 0 0 22px; color: var(--muted); }
.brand-mark {
  width: 44px; height: 44px; border-radius: 11px; background: var(--brand);
  display: grid; place-items: center; color: var(--accent);
}

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--brand); color: var(--brand-ink); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
}
.brand-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: inherit; padding: 4px; display: block; }
.brand-mark img + svg { display: none; }
.auth-logo { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto 6px; }
.auth-card .brand-mark { width: 88px; height: 88px; border-radius: 18px; }
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.sidebar .brand .brand-mark { width: 36px; height: 36px; background: rgba(255,255,255,.08); }
.sidebar .brand b { display: block; font-size: 15px; color: #fff; }
.sidebar .brand span { font-size: 12px; opacity: .7; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px;
  color: var(--brand-ink); opacity: .82; font-weight: 500; text-decoration: none;
}
.nav a:hover { background: rgba(255,255,255,.06); opacity: 1; }
.nav a.active { background: rgba(255,255,255,.12); opacity: 1; color: #fff; box-shadow: inset -3px 0 0 var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.sidebar .foot { margin-top: auto; font-size: 12px; opacity: .65; padding: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar h2 { margin: 0; font-size: 18px; }
.topbar .who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.content { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; width: 100%; }

/* ---------- components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.card-h h3 { margin: 0; font-size: 15px; }
.card-b { padding: 18px; }
.card-b.flush { padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; padding: 11px; }
.btn svg { width: 16px; height: 16px; }
.card-h h3 svg { width: 18px; height: 18px; vertical-align: -3px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 500; font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(22,78,124,.12); }
.input.ltr { text-align: left; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.form-error { color: var(--bad); font-size: 13px; min-height: 18px; margin: 4px 0 10px; }

.check { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: #fff; }
.check input { accent-color: var(--brand); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { accent-color: var(--brand); width: 18px; height: 18px; }

/* tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
table.t th, table.t td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
table.t tr:last-child td { border-bottom: none; }
table.t tbody tr:hover { background: #fafbfc; }
table.t td.actions { white-space: nowrap; text-align: left; }
.person b { display: block; font-weight: 600; }
.person span { font-size: 12px; color: var(--muted); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink-2);
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.site-tile { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.site-tile h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.site-tile ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.site-tile li { padding: 2px 0; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.filters .field { margin: 0; min-width: 160px; }

/* modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 32, .5); display: grid; place-items: center;
  padding: 16px; z-index: 50; animation: fade .15s ease;
}
.modal {
  width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
}
.modal.wide { max-width: 860px; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 16px; }
.modal-b { padding: 20px; }
.modal-f { display: flex; justify-content: flex-start; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; }
@keyframes fade { from { opacity: 0; } }

.map { height: 320px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 14px; }
.selfies { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.selfies figure { margin: 0; }
.selfies img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.selfies figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: center; }

/* toasts */
#toasts { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast {
  min-width: 260px; max-width: 380px; padding: 12px 16px; border-radius: 10px; color: #fff;
  background: var(--ink); box-shadow: var(--shadow-lg); animation: fade .2s ease; font-size: 14px;
}
.toast.ok { background: var(--ok); }
.toast.bad { background: var(--bad); }

.notice { padding: 12px 14px; border-radius: 10px; background: var(--info-bg); color: var(--info); font-size: 13.5px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
a.notice { display: block; text-decoration: none; }
.notice a { color: inherit; text-decoration: underline; }
code.k { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; }
  .sidebar .brand { padding: 0 4px 0 12px; }
  .sidebar .brand span, .sidebar .foot { display: none; }
  .nav { display: flex; gap: 4px; }
  .nav a { padding: 8px 10px; white-space: nowrap; }
  .topbar, .content { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-3, .selfies { grid-template-columns: 1fr; }
  table.t th, table.t td { white-space: nowrap; padding: 10px 12px; }
}

.nav .count { margin-inline-start: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.nav .count:empty { display: none; }
.mission-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; background: var(--surface); }
.mission-card .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mission-list { display: grid; gap: 12px; }

/* ---------- HR: employee file & payroll ---------- */
.hr-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi .value.bad { color: var(--bad); }
.kpi.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
.kpi.brand .label { color: var(--brand-ink); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; margin: 0; }
.facts dt { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.facts dd { margin: 0; font-weight: 600; }
.balance { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.balance .bx { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }
.balance .bx span { font-size: 12.5px; color: var(--muted); }
.balance .bx b { font-size: 22px; font-variant-numeric: tabular-nums; }
.balance .bx.ok { background: var(--ok-bg); border-color: transparent; }
.balance .bx.ok b { color: var(--ok); }
.balance .bx.bad { background: var(--bad-bg); border-color: transparent; }
.balance .bx.bad b { color: var(--bad); }
table.t tr.total td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--line); }
table.t td.num { font-variant-numeric: tabular-nums; }
table.pay td.num { white-space: nowrap; }
.neg { color: var(--bad); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.slip-h { display: flex; gap: 14px; align-items: center; border-bottom: 2px solid var(--brand); padding-bottom: 10px; margin-bottom: 14px; }
.slip-h img { height: 44px; }
.slip .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px; }
.slip-cols { gap: 14px; align-items: start; }
.slip-cols table.t th, .slip-cols table.t td { padding: 8px 10px; }
.slip-net { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 16px; background: var(--brand); color: #fff; border-radius: 10px; font-size: 17px; }
.slip-net b { font-size: 22px; font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) { .hr-kpis, .balance { grid-template-columns: repeat(2, minmax(0, 1fr)); } .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .facts, .slip .facts { grid-template-columns: 1fr; } }
table.t .person.wide { min-width: 230px; }
table.emp td.num, table.emp td.actions { white-space: nowrap; }
table.emp th { white-space: normal; line-height: 1.3; }
.dept-tree { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.dept-main { border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); overflow: hidden; }
.dept-main.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.dept-main .dm { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px;
  font: inherit; font-weight: 700; color: inherit; background: none; border: 0; cursor: pointer; text-align: right; }
.dept-main .dm b { font-size: 24px; font-variant-numeric: tabular-nums; }
.dept-subs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.dept-subs .ds { display: flex; justify-content: space-between; padding: 8px 14px; font: inherit; color: inherit; background: var(--surface);
  border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: right; }
.dept-subs .ds:last-child { border-bottom: 0; }
.dept-subs .ds:hover, .dept-main .dm:hover { background: var(--info-bg); }
.dept-subs .ds.on { background: var(--info-bg); color: var(--info); font-weight: 600; }
.dept-subs .ds.zero { color: var(--muted); }
.dept-subs .ds b { font-variant-numeric: tabular-nums; }
.dept-main.total { background: var(--brand); border-color: var(--brand); color: #fff; }
.dept-main.total .dm { cursor: default; }
.dept-main.total .dm:hover { background: none; }
table.emp td.job { min-width: 150px; }
table.emp td.job .badge { margin-top: 4px; }

/* ---------- HR batch 1: mission destination, requests, documents ---------- */
.search-results { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.search-results:empty { display: none; }
.chip { border: 1px solid var(--line); background: var(--card, #fff); border-radius: 999px; padding: 5px 12px;
  font: inherit; font-size: 13px; cursor: pointer; text-align: start; max-width: 100%; }
.chip:hover { border-color: var(--brand); color: var(--brand); }
.req-list { display: grid; gap: 10px; }
.req-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.req-card .who { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.req-card .what { font-size: 15px; }
.req-card .ctx { font-size: 13px; color: var(--muted); }
.req-card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs-mini { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs-mini button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.tabs-mini button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.doc-list { display: grid; gap: 8px; }
.doc-row { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; flex-wrap: wrap; }
.doc-row .doc-main { flex: 1; min-width: 180px; display: grid; gap: 2px; }
.doc-row .doc-main small { color: var(--muted); }
.nav-count { background: var(--bad, #c0392b); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 18px; margin-inline-start: auto; }

/* evaluations & recruitment */
.eval-box { margin: 6px 0 10px; }
.eval-t td { vertical-align: top; }
.score-pick { display: inline-flex; gap: 4px; }
.score-pick button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font: inherit; font-weight: 700; cursor: pointer; }
.score-pick button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.input.sm { padding: 6px 10px; font-size: 13px; }
.eval-total { padding: 10px 14px; background: var(--info-bg); color: var(--info); border-radius: 10px; margin-bottom: 12px; }
.eval-total:empty { display: none; }
.crit-group { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }
.crit-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.crit-h .btn { margin-inline-start: auto; }
.crit-items { display: grid; gap: 6px; margin-top: 8px; }
.crit-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
.crit-item > div { flex: 1; }
.crit-item.off { opacity: .55; }
.probation { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stars { color: var(--accent, #f2a900); letter-spacing: 1px; }
</style>

<body>
  <div id="app" class="boot">
    <div class="boot-spinner" aria-label="جارٍ التحميل"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module">

function modal({ title, body, submitLabel = 'حفظ', cancelLabel = 'إلغاء', wide = false, onSubmit, onOpen, danger = false, hideFooter = false }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <form class="modal ${wide ? 'wide' : ''}" novalidate>

      <div class="modal-f">
        ${onSubmit ? `<button type="submit" class="btn ${danger ? 'danger' : 'primary'}" data-submit>${esc(submitLabel)}</button>` : ''}
        <button type="button" class="btn" data-close>${esc(onSubmit ? cancelLabel : 'إغلاق')}</button>
      </div>`}
    </form>`;
  const form = backdrop.querySelector('form');
  const close = () => {
    backdrop.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => e.key === 'Escape' && close();

  backdrop.addEventListener('mousedown', (e) => e.target === backdrop && close());

    if (!onSubmit) return close();
    const btn = form.querySelector('[data-submit]');
    const err = form.querySelector('[data-error]');
    err.textContent = '';
    btn.disabled = true;
    const label = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const keep = await onSubmit(form, close);
      if (keep !== false) close();
    } catch (ex) {
      err.textContent = ex.message || 'حدث خطأ';
    } finally {
      btn.disabled = false;
      btn.innerHTML = label;
    }
  });
  document.body.appendChild(backdrop);
  const first = form.querySelector('input:not([type=hidden]), select, textarea');
  if (first) setTimeout(() => first.focus(), 30);
  onOpen?.(form, close);
  return { el: form, close };
}

function confirmDialog(title, message, { confirmLabel = 'تأكيد', danger = false } = {}) {
  return new Promise((resolve) => {
    let done = false;
    const m = modal({
      title,
      body: `<p style="margin:0">${esc(message)}</p>`,
      submitLabel: confirmLabel,
      danger,
      onSubmit: () => {
        done = true;
        resolve(true);

      if (!document.body.contains(m.el)) {
        obs.disconnect();
        if (!done) resolve(false);
      }
    });

  });
}

/** Salary in force on `date`: the latest change with effective_date <= date. */
function salaryOn(changes, date) {

  for (const c of changes) if (c.effectiveDate <= date && (!best || c.effectiveDate >= best.effectiveDate)) best = c;
  return best;
}

/**
 * Attendance summary of one employee over [from, to] (to is capped at today).
 * Days with a started/finished mission count as present. Leave days are excused.
 * Lateness is decided by the FIRST event of the day (check-in or mission arrival); an approved
 * "late arrival" permission excuses its minutes (what is left within the grace period is not late).
 */
function summarize({ from, to, today, startKey, rows, missions, leaves, settings, permissions = [] }) {
  const workDays = settings.workDays || [];
  const standard = Math.max(0, (settings.workEndMin ?? 1020) - (settings.workStartMin ?? 480));
  const last = minKey(to, today);
  const first = maxKey(from, startKey);
  const days = new Map(); // key -> { minutes, late, firstAt }
  const touch = (k) => {
    if (!days.has(k)) days.set(k, { minutes: 0, late: 0, firstAt: null });
    return days.get(k);
  };
  // The earliest arrival of the day decides lateness.
  const arrive = (d, at, late) => {
    const t = at ? new Date(at).getTime() : Number.MAX_SAFE_INTEGER;
    if (d.firstAt == null || t < d.firstAt) {
      d.firstAt = t;
      d.late = late;
    }
  };
  let noCheckout = 0;
  for (const r of rows) {
    if (r.date < from || r.date > to) continue;
    const d = touch(r.date);
    d.minutes += r.durationMinutes || 0;
    arrive(d, r.checkInAt, r.late ? r.lateMinutes || 0 : 0);
    if (r.status === 'auto_closed' || (r.flags || []).includes('no_checkout')) noCheckout += 1;
  }
  let missionDays = 0;
  for (const m of missions) {
    if (!['active', 'done'].includes(m.status) || m.date < from || m.date > to) continue;
    const d = touch(m.date);
    d.minutes += m.durationMinutes || 0;
    arrive(d, m.startedAt, m.late ? m.lateMinutes || 0 : 0);
    missionDays += 1;
  }
  const grace = Number(settings.graceMinutes ?? 15);
  for (const p of permissions) {
    if (p.permKind !== 'late' || !days.has(p.permDate)) continue;
    const d = days.get(p.permDate);
    const left = Math.max(0, d.late - Number(p.minutes || 0));
    d.late = left > grace ? left : 0;
  }
  const leaveDay = new Map(); // key -> kind (work days only)
  for (const l of leaves) {
    for (let k = maxKey(l.startDate, from); k <= minKey(l.endDate, to); k = addDays(k, 1)) {
      if (workDays.includes(weekdayIdx(k))) leaveDay.set(k, l.kind);
    }
  }
  const expected = first && last && first <= last ? workdaysBetween(first, last, workDays) : [];
  let absent = 0, unpaid = 0, paidLeave = 0;
  for (const k of expected) {
    if (days.has(k)) continue;
    const kind = leaveDay.get(k);
    if (!kind) absent += 1;
    else if (LEAVE_KINDS[kind]?.paid) paidLeave += 1;
    else unpaid += 1;
  }
  let totalMinutes = 0, overtimeMinutes = 0, lateDays = 0, lateMinutes = 0, presentWork = 0, offDaysWorked = 0;
  for (const [k, d] of days) {
    totalMinutes += d.minutes;
    if (d.late) {
      lateDays += 1;
      lateMinutes += d.late;
    }
    if (workDays.includes(weekdayIdx(k))) {
      presentWork += 1;
      overtimeMinutes += Math.max(0, d.minutes - standard);
    } else {
      offDaysWorked += 1;
      overtimeMinutes += d.minutes;
    }
  }
  return {
    workdays: expected.length, presentDays: days.size, presentWork, offDaysWorked, missionDays,
    absent, unpaid, paidLeave, lateDays, lateMinutes, totalMinutes, overtimeMinutes, noCheckout, standard,
  };
}

/* ---------------- tax & insurance (Egypt) ---------------- */

// Yearly salary-tax bands (Income Tax Law 91/2005 as amended by Law 7/2024).
const TAX_BANDS = [
  [40000, 0], [55000, 0.10], [70000, 0.15], [200000, 0.20], [400000, 0.225], [1200000, 0.25], [Infinity, 0.275],
];

/** Yearly tax on yearly taxable income (after the personal exemption). Lower bands fall away for high incomes. */
function annualTax(taxable) {
  if (!(taxable > 0)) return 0;
  const start = taxable > 1200000 ? 5 : taxable > 900000 ? 4 : taxable > 800000 ? 3 : taxable > 700000 ? 2 : taxable > 600000 ? 1 : 0;
  let tax = 0, prev = 0;
  for (let i = 0; i < TAX_BANDS.length; i++) {
    const [cap, rate] = TAX_BANDS[i];
    const r = i < start ? TAX_BANDS[start][1] : rate;
    const slice = Math.min(taxable, cap) - prev;
    if (slice > 0) tax += slice * r;
    prev = cap;
    if (taxable <= cap) break;
  }
  return tax;
}

/**
 * One employee's payroll for month `m` ('YYYY-MM').
 * att = summarize(...) for that month; adj = { bonus, deduction, advance }.
 */
function payrollLine({ m, hr, changes, att, adj, ps, settings }) {
  const end = monthEnd(m);
  const sal = salaryOn(changes, end);
  const basic = Number(sal?.basicSalary || 0);
  const allowances = Number(sal?.allowances || 0);
  const full = basic + allowances;
  // Joined during the month → pay only the days from the hire date.
  const dim = daysInMonth(m);
  let payDays = dim;
  if (hr?.hireDate && hr.hireDate > monthStart(m) && hr.hireDate <= end) payDays = dim - Number(hr.hireDate.slice(8)) + 1;
  if (hr?.hireDate && hr.hireDate > end) payDays = 0;
  const earned = round2((full * payDays) / dim);

  const dayRate = full / (ps.dayDivisor || 30);
  const stdHours = (att?.standard || (settings.workEndMin - settings.workStartMin) || 420) / 60;
  const hourRate = stdHours > 0 ? dayRate / stdHours : 0;

  const otHours = round2((att?.overtimeMinutes || 0) / 60);
  const otPay = round2(otHours * hourRate * Number(ps.otMultiplier || 1.5));
  const absenceDed = ps.deductAbsence ? round2((att?.absent || 0) * dayRate) : 0;
  const unpaidDed = round2((att?.unpaid || 0) * dayRate);
  const lateDed = ps.deductLate ? round2(((att?.lateMinutes || 0) / 60) * hourRate) : 0;
  const bonus = Number(adj?.bonus || 0);
  const gross = round2(earned + otPay + bonus);
  const attendanceDed = round2(absenceDed + unpaidDed + lateDed);

  let insWage = 0, insurance = 0;
  if (ps.insuranceEnabled && hr?.insured !== false && full > 0) {
    insWage = Number(hr?.insuranceWage || 0) || full;
    insWage = Math.min(Math.max(insWage, Number(ps.insuranceMin || 0)), Number(ps.insuranceMax || Infinity));
    insurance = round2((insWage * Number(ps.insuranceRate || 0)) / 100);
  }
  const taxableMonthly = Math.max(0, gross - attendanceDed - insurance);
  let tax = 0;
  if (ps.taxEnabled && !hr?.taxExempt) {
    tax = round2(annualTax(taxableMonthly * 12 - Number(ps.taxPersonalExemption || 0)) / 12);
  }
  const martyrs = round2(((gross - attendanceDed) * Number(ps.martyrsRate || 0)) / 100);
  const otherDed = Number(adj?.deduction || 0);
  const advance = Number(adj?.advance || 0);
  const totalDed = round2(attendanceDed + insurance + tax + martyrs + otherDed + advance);
  const net = round2(gross - totalDed);
  return {
    hasSalary: !!sal, basic, allowances, full, payDays, dim, earned, dayRate: round2(dayRate), hourRate: round2(hourRate),
    otHours, otPay, absent: att?.absent || 0, absenceDed, unpaid: att?.unpaid || 0, unpaidDed,
    lateMinutes: att?.lateMinutes || 0, lateDed, bonus, gross, insWage, insurance, tax, martyrs, otherDed, advance,
    attendanceDed, totalDed, net,
  };
}

/* ---------------- probation (فترة الاختبار) ---------------- */

/** Last day of probation: hire date + N months − 1 day. */
function probationEnd(hireDate, months) {
  if (!hireDate || !(Number(months) > 0)) return null;
  const [y, m, d] = hireDate.split('-').map(Number);
  const target = new Date(Date.UTC(y, m - 1 + Number(months), 1));
  const last = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  const end = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth(), Math.min(d, last)));
  end.setUTCDate(end.getUTCDate() - 1);
  return end.toISOString().slice(0, 10);
}

/**
 * Probation status of an employee on `today`:
 * { state: 'none'|'running'|'due'|'overdue'|'confirmed'|'not_confirmed', end, daysLeft }
 * 'due' = ends within 7 days, 'overdue' = ended without a decision.
 */
function probationState(hr, today) {
  if (hr?.probationResult) return { state: hr.probationResult, end: probationEnd(hr.hireDate, hr.probationMonths), daysLeft: null };
  const end = probationEnd(hr?.hireDate, hr?.probationMonths ?? 3);
  if (!end) return { state: 'none', end: null, daysLeft: null };
  const daysLeft = Math.round((keyToUTC(end) - keyToUTC(today)) / 864e5);
  return { state: daysLeft < 0 ? 'overdue' : daysLeft <= 7 ? 'due' : 'running', end, daysLeft };
}

/* ---------------- performance evaluation ---------------- */

const SCORE_LABELS = { 5: 'ممتاز', 4: 'جيد جدًا', 3: 'جيد', 2: 'مقبول', 1: 'ضعيف' };
const RECOMMENDATIONS = {
  '': '—', raise: 'يستحق زيادة', promotion: 'يستحق ترقية', keep: 'الاستمرار كما هو', training: 'يحتاج تدريبًا',
  warning: 'إنذار / متابعة', termination: 'إنهاء الخدمة',
};

/** Criteria that apply to an employee: for everyone + his department + his job title. */
function criteriaFor(hr, criteria) {
  return criteria.filter((c) => c.active && (c.scopeType === 'all'
    || (c.scopeType === 'department' && c.scopeValue && c.scopeValue === (hr?.department || ''))
    || (c.scopeType === 'job' && c.scopeValue && c.scopeValue.trim() === (hr?.jobTitle || '').trim())));
}

/** Weighted total out of 100 from scores 1..5. */
function evalTotal(scores) {
  const rated = scores.filter((s) => Number(s.score) >= 1);
  const w = rated.reduce((a, s) => a + Number(s.weight || 0), 0);
  if (!w) return 0;
  return round2(rated.reduce((a, s) => a + Number(s.weight) * (Number(s.score) / 5), 0) / w * 100);
}

function gradeOf(total) {
  if (total >= 90) return 'ممتاز';
  if (total >= 80) return 'جيد جدًا';
  if (total >= 65) return 'جيد';
  if (total >= 50) return 'مقبول';
  return 'ضعيف';
}

return { addDays, weekdayIdx, monthStart, monthEnd, daysInMonth, maxKey, minKey, serviceLength, LEAVE_KINDS, leaveEntitlement, leaveBalance, workdaysBetween, salaryOn, summarize, TAX_BANDS, annualTax, payrollLine, probationEnd, probationState, SCORE_LABELS, RECOMMENDATIONS, criteriaFor, evalTotal, gradeOf };

/** Accepts "30.04, 31.23", or a Google Maps link containing @lat,lng / q=lat,lng / !3dlat!4dlng */
function parseCoords(text) {
  const t = String(text || '').trim();
  const patterns = [
    /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/,
    /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /[?&](?:q|query|ll)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /^(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)$/,
  ];
  for (const p of patterns) {
    const m = p.exec(t);
    if (m) {
      const lat = Number(m[1]);
      const lng = Number(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng };
    }
  }
  return null;
}

function openSiteModal(site) {
  const isEdit = !!site;
  const s = site || { name: '', address: '', radius: 150, lat: null, lng: null, active: true };
  let map, marker, circle;

  const m = modal({
    title: isEdit ? `تعديل: ${s.name}` : 'موقع جديد',
    wide: true,
    submitLabel: isEdit ? 'حفظ التعديلات' : 'إضافة الموقع',
    body: `
      <div class="grid-2">
        <div class="field"><label>اسم الموقع *</label><input class="input" name="siteName" value="${esc(s.name)}" required /></div>
        <div class="field"><label>العنوان / الوصف</label><input class="input" name="address" value="${esc(s.address || '')}" /></div>
      </div>
      <div class="field">
        <label>مكان الموقع *</label>
        <div class="row">
          <input class="input ltr" name="coords" style="flex:1;min-width:220px" placeholder="الصق الإحداثيات أو رابط خرائط جوجل: 30.0444, 31.2357"
            value="${s.lat != null ? `${s.lat}, ${s.lng}` : ''}" />
          <button type="button" class="btn" data-here>${icon('pin')} موقعي الحالي</button>
        </div>
        <span class="hint">أو اضغط على الخريطة. من خرائط جوجل: اضغط مطولًا على المكان وانسخ الأرقام الظاهرة.</span>
      </div>
      <div class="map" data-map></div>
      <div class="grid-2">
        <div class="field"><label>نصف قطر النطاق (متر) *</label>
          <input class="input ltr" name="radius" type="number" min="30" max="2000" step="10" value="${esc(s.radius)}" /></div>
        <div class="field"><label>الحالة</label>
          <label class="switch"><input type="checkbox" name="active" ${s.active !== false ? 'checked' : ''}/> الموقع نشط ويسمح بالتسجيل</label></div>
      </div>`,
    onOpen: (form) => {
      const mapEl = form.querySelector('[data-map]');
      if (!window.L) {
        mapEl.innerHTML = '<div class="empty">تعذّر تحميل الخريطة — استخدم الإحداثيات.</div>';
        return;
      }
      const start = s.lat != null ? [s.lat, s.lng] : CAIRO;
      map = L.map(mapEl).setView(start, s.lat != null ? 16 : 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
      }).addTo(map);
      const place = (lat, lng, pan = true) => {
        const r = Number(form.radius.value) || 150;
        if (!marker) {
          marker = L.marker([lat, lng], { draggable: true }).addTo(map);
          marker.on('dragend', () => {
            const p = marker.getLatLng();
            place(p.lat, p.lng, false);
          });
          circle = L.circle([lat, lng], { radius: r, color: '#0f3b5f', fillColor: '#f2a900', fillOpacity: 0.18, weight: 2 }).addTo(map);
        } else {
          marker.setLatLng([lat, lng]);
          circle.setLatLng([lat, lng]);
        }
        circle.setRadius(r);
        form.coords.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        if (pan) map.setView([lat, lng], Math.max(map.getZoom(), 16));
      };
      if (s.lat != null) place(s.lat, s.lng);
      map.on('click', (e) => place(e.latlng.lat, e.latlng.lng, false));
      form.coords.addEventListener('change', () => {
        const c = parseCoords(form.coords.value);
        if (c) place(c.lat, c.lng);
      });
      form.radius.addEventListener('input', () => circle && circle.setRadius(Number(form.radius.value) || 150));
      form.querySelector('[data-here]').addEventListener('click', () => {
        if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع', 'bad');
        navigator.geolocation.getCurrentPosition(
          (p) => place(p.coords.latitude, p.coords.longitude),
          () => toast('تعذّر تحديد موقعك. اسمح للمتصفح باستخدام الموقع.', 'bad'),
          { enableHighAccuracy: true, timeout: 15000 }
        );
      });
      setTimeout(() => map.invalidateSize(), 120);
    },
    onSubmit: async (form) => {
      const name = form.siteName.value.trim();
      const coords = parseCoords(form.coords.value);
      const radius = Math.round(Number(form.radius.value));
      if (name.length < 2) throw new Error('اكتب اسم الموقع.');
      if (!coords) throw new Error('حدد مكان الموقع على الخريطة أو الصق الإحداثيات.');
      if (!(radius >= 30 && radius <= 2000)) throw new Error('يجب أن يكون النطاق بين 30 و2000 متر.');
      const data = {
        name,
        address: form.address.value.trim(),
        lat: coords.lat,
        lng: coords.lng,
        radius,
        active: form.active.checked,
      };
      await saveSite(isEdit ? s.id : null, data);
      refresh('sites');
      toast(isEdit ? 'تم حفظ التعديلات' : 'تمت إضافة الموقع', 'ok');
    },
  });
  return m;
}

return { render, parseCoords };
})();

          <span><span class="ltr">${esc(e.code)}</span> · ${esc(hr.jobTitle || 'لم تُحدَّد الوظيفة')}${deptLabel(hr) ? ` · ${esc(deptLabel(hr))}` : ''} · ${e.active ? 'نشط' : 'موقوف'}</span></div>
        <div class="row">
          <a class="btn" href="#/engineers">رجوع</a>
          <button class="btn primary" data-act="edit">${icon('edit')} البيانات الوظيفية</button>
          <button class="btn" data-act="xls">${icon('download')} تصدير Excel</button>
        </div></div></section>

      <section class="kpis hr-kpis">
        ${kpi('الراتب الحالي', cur ? money(cur.basicSalary + cur.allowances) : '—', cur ? `أساسي ${money(cur.basicSalary)} + بدلات ${money(cur.allowances)}` : 'لم يُسجَّل راتب')}
        ${kpi('رصيد الإجازات', `${fmtNum(bal.remaining)} يوم`, `من ${fmtNum(bal.entitlement + bal.opening)} لعام ${bal.year}`, bal.remaining < 0 ? 'bad' : '')}
        ${kpi('مدة الخدمة', svc ? serviceText(svc) : '—', hr.hireDate ? `منذ ${hr.hireDate}` : 'لم يُحدَّد تاريخ التعيين')}
        ${kpi('آخر زيادة', lastRaise(sal), '')}
      </section>

      ${probationCard(hr, today)}

      <section class="card"><div class="card-h"><h3>البيانات الوظيفية</h3></div>
        <div class="card-b"><dl class="facts">
          ${fact('الوظيفة', esc(hr.jobTitle || '—'))}
          ${fact('الإدارة', esc(hr.department || '—'))}
          ${fact('القسم', esc(hr.section || '—'))}
          ${fact('تاريخ التعيين', hr.hireDate ? `<span class="ltr">${hr.hireDate}</span>` : '—')}
          ${fact('تاريخ الميلاد', hr.birthDate ? `<span class="ltr">${hr.birthDate}</span>` : '—')}
          ${fact('الهاتف', esc(e.phone || '—'))}
          ${fact('مواقع العمل', (e.siteIds || []).map((s) => esc(siteName(s))).join('، ') || '—')}
          ${fact('مواعيد العمل', `${esc(getState().settings.workStart)} – ${esc(getState().settings.workEnd)} (${fmtNum((hrSettings().workEndMin - hrSettings().workStartMin) / 60)} ساعات يوميًا)`)}
          ${fact('التأمينات', hr.insured === false ? 'غير مؤمَّن عليه' : `مؤمَّن عليه${hr.insuranceWage ? ` — أجر الاشتراك ${money(hr.insuranceWage)}` : ''}`)}
          ${fact('ضريبة كسب العمل', hr.taxExempt ? 'معفى' : 'تُحتسب')}
          ${hr.notes ? fact('ملاحظات', esc(hr.notes)) : ''}
        </dl></div></section>

      <section class="card"><div class="card-h"><h3>الراتب والزيادات</h3>
        <button class="btn primary sm" data-act="raise">${icon('plus')} تسجيل زيادة / تعديل راتب</button></div>
        <div class="card-b flush table-wrap">${salaryTable(sal)}</div></section>

      <section class="card"><div class="card-h"><h3>الإجازات</h3>
        <button class="btn primary sm" data-act="leave">${icon('plus')} تسجيل إجازة</button></div>
        <div class="card-b">
          <div class="balance">
            ${bx('المستحق لعام ' + bal.year, bal.entitlement)}
            ${bx('مرحَّل من قبل', bal.opening)}
            ${bx('المستخدَم (اعتيادية + عارضة)', bal.used)}
            ${bx('المتبقي', bal.remaining, bal.remaining < 0 ? 'bad' : 'ok')}
          </div>
          <p class="muted small" style="margin:10px 0 0">${hr.leaveDaysOverride != null ? 'رصيد سنوي مخصص لهذا الموظف.' : 'حسب قانون العمل: لا رصيد قبل 6 أشهر، و15 يومًا في السنة الأولى، و21 يومًا بعدها، و30 يومًا بعد 10 سنوات خدمة أو بلوغ 50 عامًا.'} العارضة تُخصم من الرصيد السنوي (المستخدَم منها هذا العام: ${fmtNum(bal.casual)} يوم).</p>
        </div>
        <div class="card-b flush table-wrap">${leaveTable(lv)}</div></section>

      <section class="card"><div class="card-h"><h3>${icon('star')} تقييمات الأداء</h3>
        <button class="btn primary sm" data-act="eval">${icon('plus')} تقييم جديد</button></div>
        <div class="card-b flush table-wrap" id="evals"></div></section>

      <section class="card"><div class="card-h"><h3>${icon('file')} المستندات والعقود</h3>
        <button class="btn primary sm" data-act="doc">${icon('plus')} إضافة مستند</button></div>
        <div class="card-b" id="docs"></div></section>

      <section class="card"><div class="card-h"><h3>تقرير الحضور منذ التعيين</h3><span class="muted small" id="repMeta"></span></div>
        <div class="card-b flush table-wrap" id="report"><div class="empty"><span class="spinner"></span></div></div></section>`;
    drawReport();
    drawDocs();
    drawEvals();
  };

  const loadEvals = async () => {
    try {
      evals = await listEvaluations(id);
    } catch (err) {
      evals = { error: /evaluations/.test(err.message) ? 'جداول التقييم غير مفعّلة في قاعدة البيانات بعد.' : err.message };
    }
    drawEvals();
  };
  const drawEvals = () => {
    const el = $('#evals', page);
    if (!el) return;
    if (!evals) return (el.innerHTML = '<div class="empty"><span class="spinner"></span></div>');
    if (evals.error) return (el.innerHTML = `<div class="empty">${esc(evals.error)}</div>`);
    el.innerHTML = evals.length
      ? `<table class="t"><thead><tr><th>الفترة</th><th>التاريخ</th><th>النتيجة</th><th>التوصية</th><th>المُقيِّم</th><th></th></tr></thead><tbody>
        ${evals.map((v) => `<tr><td><b>${esc(v.period)}</b></td><td class="num">${esc(v.evalDate)}</td>
          <td>${badge(`${v.total}% — ${v.grade}`, gradeKind(v.total))}</td><td class="small">${esc(RECOMMENDATIONS[v.recommendation] || '—')}</td>
          <td class="small">${esc(v.evaluator || '—')}</td>
          <td class="actions"><button class="btn sm" data-print-eval="${esc(v.id)}" title="طباعة">${icon('file')}</button>
            <button class="btn sm" data-edit-eval="${esc(v.id)}" title="تعديل">${icon('edit')}</button>
            <button class="btn sm danger" data-del-eval="${esc(v.id)}" title="حذف">${icon('trash')}</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">لم يُقيَّم بعد.</div>';
  };

  const loadDocs = async () => {
    try {
      docs = await listDocs(id);
    } catch (err) {
      docs = { error: /employee_documents/.test(err.message) ? 'جدول المستندات غير موجود في قاعدة البيانات بعد.' : err.message };
    }
    drawDocs();
  };
  const drawDocs = () => {
    const el = $('#docs', page);
    if (!el) return;
    if (!docs) return (el.innerHTML = '<div class="empty"><span class="spinner"></span></div>');
    if (docs.error) return (el.innerHTML = `<div class="empty">${esc(docs.error)}</div>`);
    if (!docs.length) {
      el.innerHTML = '<div class="empty">لا توجد مستندات بعد. أضف العقد وصورة البطاقة والمؤهل… مع تاريخ الانتهاء ليصلك تنبيه قبلها بشهر.</div>';
      return;
    }
    el.innerHTML = `<div class="doc-list">${docs.map((d) => `<div class="doc-row">
      <div class="doc-main"><b>${esc(DOC_KINDS[d.kind] || 'مستند')}${d.title ? ` — ${esc(d.title)}` : ''}</b>
        <small>${[d.number ? `رقم: <span class="ltr">${esc(d.number)}</span>` : '', d.issueDate ? `الإصدار: <span class="ltr">${d.issueDate}</span>` : '',
          d.expiryDate ? `الانتهاء: <span class="ltr">${d.expiryDate}</span>` : 'بدون تاريخ انتهاء'].filter(Boolean).join(' · ')}</small>
        ${d.notes ? `<small>${esc(d.notes)}</small>` : ''}</div>
      ${expiryBadge(d.expiryDate)}
      ${d.filePath ? `<button class="btn sm" data-open-doc="${esc(d.id)}">${icon('file')} فتح</button>` : '<span class="muted small">بدون ملف</span>'}
      <button class="btn sm" data-edit-doc="${esc(d.id)}" title="تعديل">${icon('edit')}</button>
      <button class="btn sm danger" data-del-doc="${esc(d.id)}" title="حذف">${icon('trash')}</button>
    </div>`).join('')}</div>`;
  };

  const loadReport = async () => {
    const e = getState().engineers.find((x) => x.id === id);
    if (!e || loading) return;
    loading = true;
    try {
      const hr = hrOf(id);
      const today = todayKey();
      const from = countFrom(e, hr) || today;
      const [rows, missions, perms] = await Promise.all([attendanceForUser(id, from, today), missionsBetween(from, today, id), approvedPermissions(from, today, id)]);
      report = { from, rows, missions, perms };
      drawReport();
    } catch (err) {
      const el = $('#report', page);
      if (el) el.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    } finally {
      loading = false;
    }
  };

  const months = () => {
    if (!report) return [];
    const e = getState().engineers.find((x) => x.id === id);
    const hr = hrOf(id);
    const today = todayKey();
    const settings = hrSettings();
    const out = [];
    for (let m = report.from.slice(0, 7); m <= today.slice(0, 7); m = addDays(monthEnd(m), 1).slice(0, 7)) {
      const from = maxKey(`${m}-01`, report.from);
      const to = minKey(monthEnd(m), today);
      const a = summarize({
        from, to, today, startKey: countFrom(e, hr), rows: report.rows, missions: report.missions, leaves: leavesOf(id), settings, permissions: report.perms,
      });
      out.push({ m, ...a });
    }
    return out.reverse();
  };

  const drawReport = () => {
    const el = $('#report', page);
    if (!el) return;
    if (!report) {
      el.innerHTML = `<div class="empty"><span class="spinner"></span></div>`;
      return;
    }
    const list = months();
    const tot = list.reduce((a, r) => {
      for (const k of ['workdays', 'presentDays', 'absent', 'paidLeave', 'unpaid', 'lateDays', 'lateMinutes', 'totalMinutes', 'overtimeMinutes', 'missionDays']) a[k] = (a[k] || 0) + r[k];
      return a;
    }, {});
    $('#repMeta', page).textContent = `منذ ${report.from} · بدأ احتساب الغياب من تاريخ التعيين أو من بدء استخدام النظام (الأحدث)`;
    el.innerHTML = list.length
      ? `<table class="t"><thead><tr><th>الشهر</th><th>أيام عمل</th><th>حضور</th><th>غياب</th><th>إجازة</th><th>بدون أجر</th><th>مأموريات</th><th>تأخير</th><th>ساعات العمل</th><th>إضافي (ساعة)</th></tr></thead>
        <tbody>${list.map((r) => `<tr>
          <td><b>${monthLabel(r.m)}</b></td><td class="num">${r.workdays}</td><td class="num">${r.presentDays}</td>
          <td class="num">${r.absent ? badge(r.absent, 'bad') : 0}</td><td class="num">${r.paidLeave}</td>
          <td class="num">${r.unpaid ? badge(r.unpaid, 'warn') : 0}</td><td class="num">${r.missionDays}</td>
          <td class="num">${r.lateDays ? `${badge(r.lateDays, 'warn')} <span class="muted small">${fmtDuration(r.lateMinutes)}</span>` : 0}</td>
          <td class="num">${fmtHours(r.totalMinutes)}</td><td class="num">${fmtHours(r.overtimeMinutes)}</td></tr>`).join('')}
          <tr class="total"><td>الإجمالي</td><td class="num">${tot.workdays}</td><td class="num">${tot.presentDays}</td><td class="num">${tot.absent}</td>
          <td class="num">${tot.paidLeave}</td><td class="num">${tot.unpaid}</td><td class="num">${tot.missionDays}</td>
          <td class="num">${tot.lateDays} <span class="muted small">${fmtDuration(tot.lateMinutes)}</span></td>
          <td class="num">${fmtHours(tot.totalMinutes)}</td><td class="num">${fmtHours(tot.overtimeMinutes)}</td></tr></tbody></table>`
      : `<div class="empty">لا توجد بيانات بعد.</div>`;
  };

  page.addEventListener('click', (ev) => onClick(ev).catch((err) => toast(err.message || 'حدث خطأ', 'bad')));

  async function onClick(ev) {
    const b = ev.target.closest('button');
    if (!b) return;
    const e = getState().engineers.find((x) => x.id === id);
    if (b.dataset.act === 'edit') openHrModal(e);
    if (b.dataset.act === 'raise') openRaiseModal(e);
    if (b.dataset.act === 'leave') openLeaveModal(e);
    if (b.dataset.act === 'xls') exportFile(e, months());
    const findEval = (k) => (Array.isArray(evals) ? evals.find((v) => v.id === k) : null);
    if (b.dataset.act === 'eval') openEvalModal({ uid: id, done: loadEvals });
    if (b.dataset.printEval) printEvaluation(findEval(b.dataset.printEval));
    if (b.dataset.editEval) openEvalModal({ ev: findEval(b.dataset.editEval), done: loadEvals });
    if (b.dataset.delEval && await confirmDialog('حذف التقييم', 'حذف هذا التقييم نهائيًا؟', { confirmLabel: 'حذف', danger: true })) {
      await deleteEvaluation(b.dataset.delEval);
      loadEvals();
    }
    if (b.dataset.probation) await openProbationModal(e, b.dataset.probation);
    const doc = (k) => (Array.isArray(docs) ? docs.find((d) => d.id === k) : null);
    if (b.dataset.act === 'doc') openDocModal(e, null, loadDocs);
    if (b.dataset.editDoc) openDocModal(e, doc(b.dataset.editDoc), loadDocs);
    if (b.dataset.openDoc) {
      const w = window.open('', '_blank');
      const url = await docUrl(doc(b.dataset.openDoc)?.filePath);
      if (url && w) w.location.href = url;
      else {
        w?.close();
        toast('تعذّر فتح الملف', 'bad');
      }
    }
    if (b.dataset.delDoc) {
      const d = doc(b.dataset.delDoc);
      if (d && await confirmDialog('حذف المستند', `حذف «${DOC_KINDS[d.kind] || 'المستند'}» وملفه نهائيًا؟ لا يمكن التراجع.`, { confirmLabel: 'حذف', danger: true })) {
        await deleteDoc(d);
        toast('تم الحذف', 'ok');
        loadDocs();
      }
    }
    if (b.dataset.delSalary) {
      if (await confirmDialog('حذف السطر', 'حذف هذا السطر من سجل الراتب؟', { confirmLabel: 'حذف', danger: true })) {
        await deleteSalaryChange(b.dataset.delSalary);
        refresh('hr');
        toast('تم الحذف', 'ok');
      }
    }
    if (b.dataset.delLeave) {
      if (await confirmDialog('حذف الإجازة', 'حذف هذه الإجازة؟ سيعود رصيدها إلى الموظف.', { confirmLabel: 'حذف', danger: true })) {
        await deleteLeave(b.dataset.delLeave);
        refresh('hr');
        toast('تم الحذف', 'ok');
      }
    }
  }

  const unsub = subscribe(() => {
    draw();
    if (!report && getState().ready.engineers && getState().ready.hr && !getState().hrMissing) loadReport();
  });
  draw();
  if (getState().ready.engineers && getState().ready.hr && !getState().hrMissing) loadReport();
  loadDocs();
  loadEvals();
  return unsub;
}

/* ---------------- pieces ---------------- */

const fmtNum = (n) => (Math.round(Number(n || 0) * 100) / 100).toString();
const kpi = (label, value, sub, kind = '') =>
  `<div class="card kpi"><div class="label">${label}</div><div class="value ${kind}" style="font-size:22px">${value}</div>${sub ? `<div class="muted small">${sub}</div>` : ''}</div>`;
const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
const bx = (label, v, kind = '') => `<div class="bx ${kind}"><span>${label}</span><b>${fmtNum(v)}</b></div>`;

function lastRaise(sal) {
  if (sal.length < 2) return sal.length ? 'لا توجد زيادات بعد' : '—';
  const a = sal[sal.length - 2];
  const b = sal[sal.length - 1];
  const before = a.basicSalary + a.allowances;
  const after = b.basicSalary + b.allowances;
  const pct = before ? ` (${fmtNum(((after - before) / before) * 100)}%)` : '';
  return `<span style="font-size:18px">${money(after - before)}${pct}</span><div class="muted small">في ${b.effectiveDate}</div>`;
}

function salaryTable(sal) {
  if (!sal.length) return `<div class="empty">لم يُسجَّل راتب بعد — اضغط "تسجيل زيادة / تعديل راتب" وأدخل الراتب عند التعيين.</div>`;
  return `<table class="t"><thead><tr><th>من تاريخ</th><th>الأساسي</th><th>البدلات</th><th>الإجمالي</th><th>التغيير</th><th>ملاحظة</th><th></th></tr></thead><tbody>${[...sal]
    .reverse()
    .map((s, i, arr) => {
      const prev = arr[i + 1];
      const total = s.basicSalary + s.allowances;
      const ptotal = prev ? prev.basicSalary + prev.allowances : null;
      const diff = prev ? total - ptotal : null;
      return `<tr><td class="num ltr">${s.effectiveDate}</td><td class="num">${money(s.basicSalary)}</td><td class="num">${money(s.allowances)}</td>
        <td class="num"><b>${money(total)}</b></td>
        <td class="num">${diff == null ? badge('عند التعيين', 'info') : badge(`${diff >= 0 ? '+' : ''}${money(diff)}${ptotal ? ` (${fmtNum((diff / ptotal) * 100)}%)` : ''}`, diff >= 0 ? 'ok' : 'bad')}</td>
        <td>${esc(s.note)}</td><td class="actions"><button class="btn sm ghost" data-del-salary="${esc(s.id)}" title="حذف">${icon('trash')}</button></td></tr>`;
    })
    .join('')}</tbody></table>`;
}

function leaveTable(lv) {
  if (!lv.length) return `<div class="empty">لا توجد إجازات مسجلة.</div>`;
  return `<table class="t"><thead><tr><th>النوع</th><th>من</th><th>إلى</th><th>الأيام</th><th>ملاحظة</th><th></th></tr></thead><tbody>${lv
    .map((l) => `<tr><td>${badge(LEAVE_KINDS[l.kind]?.label || l.kind, l.kind === 'unpaid' ? 'warn' : LEAVE_KINDS[l.kind]?.fromBalance ? 'info' : '')}</td>
      <td class="num ltr">${l.startDate}</td><td class="num ltr">${l.endDate}</td><td class="num">${fmtNum(l.days)}</td><td>${esc(l.note)}</td>
      <td class="actions"><button class="btn sm ghost" data-del-leave="${esc(l.id)}" title="حذف">${icon('trash')}</button></td></tr>`)
    .join('')}</tbody></table>`;
}

/* ---------------- modals ---------------- */

function openHrModal(e) {
  const hr = hrOf(e.id) || {};
  modal({
    title: `البيانات الوظيفية — ${e.name}`,
    wide: true,
    onOpen: (f) => wireDeptFields(f),
    body: `
      <div class="grid-2">
        <div class="field"><label>الوظيفة</label><input class="input" name="jobTitle" value="${esc(hr.jobTitle || '')}" placeholder="مثال: مهندس مدني" list="jobList" /></div>
        <div class="field"><label>مدة فترة الاختبار (شهر)</label><input class="input ltr" type="number" min="0" max="6" step="1" name="probationMonths" value="${esc(hr.probationMonths ?? 3)}" />
          <span class="hint">تبدأ من تاريخ التعيين، وتصلك رسالة قبل نهايتها بأسبوع. 0 = بدون فترة اختبار.</span></div>
        ${deptFields(hr)}
        <div class="field"><label>تاريخ التعيين</label><input class="input ltr" type="date" name="hireDate" value="${esc(hr.hireDate || '')}" /></div>
        <div class="field"><label>تاريخ الميلاد (اختياري — لرصيد الإجازات بعد سن 50)</label><input class="input ltr" type="date" name="birthDate" value="${esc(hr.birthDate || '')}" /></div>
        <div class="field"><label>رصيد إجازات مرحَّل إلى هذا العام (يوم)</label><input class="input ltr" type="number" step="0.5" name="leaveOpening" value="${esc(hr.leaveOpening ?? 0)}" />
          <span class="hint">بالسالب إذا استخدم أيامًا هذا العام قبل بدء النظام.</span></div>
        <div class="field"><label>رصيد سنوي مخصص (اتركه فارغًا لتطبيق القانون)</label><input class="input ltr" type="number" step="0.5" name="leaveDaysOverride" value="${esc(hr.leaveDaysOverride ?? '')}" /></div>
        <div class="field"><label>أجر الاشتراك التأميني (اتركه فارغًا = الأساسي + البدلات)</label><input class="input ltr" type="number" step="0.01" name="insuranceWage" value="${esc(hr.insuranceWage ?? '')}" /></div>
      </div>
      <div class="checks" style="margin:4px 0 14px">
        <label class="check"><input type="checkbox" name="insured" ${hr.insured === false ? '' : 'checked'} /> مؤمَّن عليه</label>
        <label class="check"><input type="checkbox" name="taxExempt" ${hr.taxExempt ? 'checked' : ''} /> معفى من ضريبة كسب العمل</label>
      </div>
      <div class="field"><label>ملاحظات</label><textarea class="input" name="notes" rows="2">${esc(hr.notes || '')}</textarea></div>
      ${hrDatalists()}`,
    onSubmit: async (f) => {
      const v = (n) => f[n].value.trim();
      await saveHr(e.id, {
        jobTitle: v('jobTitle'), department: v('department'), section: v('section'), hireDate: v('hireDate'), birthDate: v('birthDate'),
        leaveOpening: Number(v('leaveOpening') || 0), leaveDaysOverride: v('leaveDaysOverride') === '' ? null : Number(v('leaveDaysOverride')),
        insuranceWage: v('insuranceWage') === '' ? null : Number(v('insuranceWage')),
        insured: f.insured.checked, taxExempt: f.taxExempt.checked, notes: v('notes'),
        probationMonths: Math.min(6, Math.max(0, Math.round(Number(v('probationMonths') || 0)))),
      });
      refresh('hr');
      toast('تم الحفظ', 'ok');
    },
  });
}

function openRaiseModal(e) {
  const sal = salariesOf(e.id);
  const cur = salaryOn(sal, '9999-12-31');
  const hr = hrOf(e.id) || {};
  const first = !sal.length;
  modal({

/** Probation card in the employee file: status + decision buttons. */
function probationCard(hr, today) {
  const p = probationState(hr, today);
  if (p.state === 'none') return '';
  const decided = p.state === 'confirmed' || p.state === 'not_confirmed';
  const status = {
    running: badge(`في فترة الاختبار — تنتهي بعد ${p.daysLeft} يوم`, 'info'),
    due: badge(p.daysLeft === 0 ? 'فترة الاختبار تنتهي اليوم' : `فترة الاختبار تنتهي بعد ${p.daysLeft} يوم`, 'warn'),

    confirmed: badge('تم التثبيت بعد فترة الاختبار', 'ok'),
    not_confirmed: badge('لم يُثبَّت بعد فترة الاختبار', 'bad'),

/** Badge for a document's expiry: expired / soon (≤ 30 days) / valid. */
function expiryBadge(date) {
  if (!date) return '';
  const days = Math.round((new Date(`${date}T12:00:00Z`) - new Date(`${todayKey()}T12:00:00Z`)) / 864e5);
  if (days < 0) return badge(`انتهى منذ ${-days} يوم`, 'bad');
  if (days === 0) return badge('ينتهي اليوم', 'bad');
  if (days <= 30) return badge(`ينتهي بعد ${days} يوم`, 'warn');
  return badge('ساري', 'ok');
}

        if (f.from.value && f.to.value && f.to.value >= f.from.value) {
          f.days.value = workdaysBetween(f.from.value, f.to.value, getState().settings.workDays || []).length;

      f.from.addEventListener('change', () => {
        if (f.to.value < f.from.value) f.to.value = f.from.value;
        calc();
      });
      f.to.addEventListener('change', calc);
      calc();
    },
    onSubmit: async (f) => {
      if (!f.from.value || !f.to.value || f.to.value < f.from.value) throw new Error('راجع التواريخ.');

  });

  for (const [name, data] of [['البيانات', info], ['الراتب والزيادات', sal], ['الإجازات', lv], ['الحضور الشهري', rep]]) {

/** Department + sub-department fields (inside a modal form). Call wireDeptFields(form) in onOpen. */

function wireDeptFields(form) {

    form.querySelector('#secList').innerHTML = opts.map((o) => `<option value="${esc(o)}"></option>`).join('');
  };
  form.department.addEventListener('change', fill);

}

}

function genPassword() {
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  const arr = new Uint32Array(8);
  crypto.getRandomValues(arr);
  return [...arr].map((n) => chars[n % chars.length]).join('');
}

function exportEmployees(list, groups) {
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمّل، تأكد من الإنترنت', 'bad');
  const today = todayKey();
  const rows = list.map((e) => {
    const hr = hrOf(e.id) || {};
    const sal = salaryOn(salariesOf(e.id), today);
    return {
      'الكود': e.code, 'الاسم': e.name, 'الوظيفة': hr.jobTitle || '', 'الإدارة': hr.department || '', 'القسم': hr.section || '',
      'تاريخ التعيين': hr.hireDate || '', 'الراتب الأساسي': sal?.basicSalary ?? '', 'البدلات': sal?.allowances ?? '',
      'رصيد الإجازات': leaveBalance(hr, leavesOf(e.id), today).remaining, 'الحالة': e.active ? 'نشط' : 'موقوف',
    };
  });
  const byDept = [];
  for (const g of groups) {
    byDept.push({ 'الإدارة': g.name === '—' ? 'بدون إدارة' : g.name, 'القسم': 'الإجمالي', 'عدد الموظفين': g.count });
    for (const [sec, n] of g.secs) if (g.name !== '—') byDept.push({ 'الإدارة': '', 'القسم': sec, 'عدد الموظفين': n });
  }
  byDept.push({ 'الإدارة': 'إجمالي الشركة', 'القسم': '', 'عدد الموظفين': groups.reduce((a, g) => a + g.count, 0) });
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  for (const [name, data] of [['الموظفون', rows], ['حسب الإدارة والقسم', byDept]]) {
    const ws = XLSX.utils.json_to_sheet(data.length ? data : [{ '': 'لا توجد بيانات' }]);
    ws['!cols'] = Object.keys(data[0] || { a: 1 }).map((k) => ({ wch: Math.max(14, k.length + 8) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  XLSX.writeFile(wb, `الموظفون_${today}.xlsx`);
}

return { render };

      if (seen.has(k)) return false;
      seen.add(k);

    })

          results.querySelectorAll('[data-i]').forEach((b) =>
            b.addEventListener('click', () => {

      if (b.dataset.edit) openEvalModal({ ev: findEval(b.dataset.edit), done: load });
      if (b.dataset.del && await confirmDialog('حذف التقييم', 'حذف هذا التقييم نهائيًا؟', { confirmLabel: 'حذف', danger: true })) {

    }

    dept = e.target.value;
    draw();
  });

  const load = async () => {
    try {
      [criteria, evals] = await Promise.all([listCriteria(), listEvaluations()]);
      error = '';
    } catch (err) {
      error = /eval_criteria|evaluations/.test(err.message) ? 'جداول التقييم غير مفعّلة في قاعدة البيانات بعد.' : err.message;
    }
    draw();
  };
  load();
  const u1 = watch('evaluations', load);
  const u2 = watch('eval_criteria', load);
  const u3 = subscribe(draw);
  return () => {
    u1();
    u2();
    u3();
  };

return { render };
})();

/** Aggregates attendance rows into a per-engineer payroll-ready summary. */
function compute(rows, from, to, engFilter, siteFilter) {
  const { engineers, settings } = getState();
  const start = parseHHMM(settings.workStart) ?? 480;
  const end = parseHHMM(settings.workEnd) ?? 1020;
  const standard = Math.max(0, end - start);
  const workDays = settings.workDays || [];
  const lastDay = to < todayKey() ? to : todayKey();

  const workdayKeys = [];
  for (let k = from; k <= lastDay; k = addDaysKey(k, 1)) {
    if (workDays.includes(weekdayIndexOfKey(k))) workdayKeys.push(k);
  }

  const people = new Map();
  const ensure = (uid, name, code) => {
    if (!people.has(uid)) people.set(uid, { uid, name, code, days: new Map(), late: new Map(), noCheckout: 0 });
    return people.get(uid);
  };
  if (!siteFilter) {
    engineers
      .filter((e) => (engFilter ? e.id === engFilter : e.active))
      .forEach((e) => ensure(e.id, e.name, e.code));
  }

  for (const r of rows) {
    const p = ensure(r.uid, r.name, r.code);
    const minutes = r.durationMinutes || 0;
    const d = p.days.get(r.date) || { minutes: 0, nonWorkday: !!r.nonWorkday };
    d.minutes += minutes;
    p.days.set(r.date, d);
    if (r.late) p.late.set(r.date, Math.max(p.late.get(r.date) || 0, r.lateMinutes || 0));
    if (r.status === 'auto_closed' || (r.flags || []).includes('no_checkout')) p.noCheckout += 1;
  }

  const summary = [...people.values()].map((p) => {
    const eng = engineers.find((e) => e.id === p.uid);
    const created = eng?.createdAt ? dateKey(toDate(eng.createdAt)) : from;
    const expected = workdayKeys.filter((k) => k >= created);
    let presentWork = 0;
    let offDaysWorked = 0;
    let totalMinutes = 0;
    let overtimeMinutes = 0;
    for (const [key, d] of p.days) {
      const isWork = workDays.includes(weekdayIndexOfKey(key));
      totalMinutes += d.minutes;
      if (isWork) {
        presentWork += 1;
        overtimeMinutes += Math.max(0, d.minutes - standard);
      } else {
        offDaysWorked += 1;
        overtimeMinutes += d.minutes;
      }
    }
    const absentDays = siteFilter ? null : Math.max(0, expected.length - expected.filter((k) => p.days.has(k)).length);
    return {
      uid: p.uid,
      name: p.name || eng?.name || '—',
      code: p.code || eng?.code || '',
      presentDays: p.days.size,
      presentWork,
      absentDays,
      lateDays: p.late.size,
      lateMinutes: [...p.late.values()].reduce((a, b) => a + b, 0),
      totalMinutes,
      overtimeMinutes,
      offDaysWorked,
      noCheckout: p.noCheckout,
    };
  });
  summary.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar'));
  return { summary, workdayCount: workdayKeys.length };
}

return { render, compute };
})();

function exportExcel(lines, month) {
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمّل، تأكد من الإنترنت', 'bad');
  if (!lines.length) return;
  const rows = lines.map(({ e, hr, p, adj }) => ({
    'الكود': e.code, 'الاسم': e.name, 'الوظيفة': hr.jobTitle || '', 'الإدارة': hr.department || '', 'القسم': hr.section || '', 'الأساسي': p.basic, 'البدلات': p.allowances,
    'أيام الاستحقاق': p.payDays, 'المستحق': p.earned, 'ساعات إضافية': p.otHours, 'قيمة الإضافي': p.otPay, 'مكافأة': p.bonus,
    'إجمالي المستحقات': p.gross, 'أيام الغياب': p.absent, 'خصم الغياب': p.absenceDed, 'أيام بدون أجر': p.unpaid,
    'خصم بدون أجر': p.unpaidDed, 'دقائق التأخير': p.lateMinutes, 'خصم التأخير': p.lateDed, 'أجر الاشتراك': p.insWage,
    'التأمينات': p.insurance, 'ضريبة كسب العمل': p.tax, 'صندوق الشهداء': p.martyrs, 'خصومات أخرى': p.otherDed, 'سلف': p.advance,
    'إجمالي الاستقطاعات': p.totalDed, 'الصافي': p.net, 'ملاحظة': adj.note || '',
  }));
  const totals = { 'الكود': '', 'الاسم': 'الإجمالي' };
  for (const k of Object.keys(rows[0])) if (typeof rows[0][k] === 'number' && k !== 'أيام الاستحقاق') totals[k] = Math.round(rows.reduce((a, r) => a + r[k], 0) * 100) / 100;
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  const ws = XLSX.utils.json_to_sheet([...rows, totals]);
  ws['!cols'] = Object.keys(rows[0]).map((k) => ({ wch: Math.max(12, k.length + 4) }));
  XLSX.utils.book_append_sheet(wb, ws, 'كشف الرواتب');
  XLSX.writeFile(wb, `كشف_رواتب_${month}.xlsx`);
}

return { render };
})();

const __m_js_pages_security = (() => {
const { listAttempts, watch } = __m_js_api;
const { esc, $, badge, fmtDateTime, REASON_LABELS, TYPE_LABELS, mapsLink } = __m_js_ui;


const SERIOUS = new Set(['mock_location', 'device_mismatch']);

function render(page) {
  let rows = [];
  let onlySerious = false;

  page.innerHTML = `
    <div class="notice">هنا جميع محاولات التسجيل المرفوضة. يصلك إشعار فوري على تليجرام بمحاولات <b>تزييف الموقع</b> و<b>الهاتف غير المسجل</b>.</div>
    <section class="card">
      <div class="card-h"><h3>المحاولات المرفوضة (آخر 300)</h3>
        <label class="switch small"><input type="checkbox" id="serious" /> المحاولات الخطيرة فقط</label></div>
      <div class="card-b flush table-wrap" id="list"><div class="empty"><span class="spinner"></span></div></div>
    </section>`;

  const draw = () => {
    const list = onlySerious ? rows.filter((r) => SERIOUS.has(r.reason)) : rows;
    $('#list', page).innerHTML = list.length
      ? `<table class="t"><thead><tr><th>الوقت</th><th>الموظف</th><th>العملية</th><th>السبب</th><th>التفاصيل</th></tr></thead><tbody>${list
          .map((r) => {
            const [label, kind] = REASON_LABELS[r.reason] || [r.reason, ''];
            return `<tr>
              <td class="num">${fmtDateTime(r.createdAt)}</td>
              <td class="person"><b>${esc(r.name || 'غير معروف')}</b><span class="ltr">${esc(r.code || '')}</span></td>
              <td>${esc(TYPE_LABELS[r.type] || r.type || '')}</td>
              <td>${badge(label, kind)}</td>
              <td class="small">${esc(r.message || '')} ${r.accuracy != null ? `<span class="muted">· دقة ±${Math.round(r.accuracy)} م</span>` : ''}
                ${mapsLink(r.lat, r.lng, 'الموقع ↗')}</td></tr>`;
          })
          .join('')}</tbody></table>`
      : `<div class="empty">لا توجد محاولات مرفوضة 👍</div>`;
  };

  $('#serious', page).addEventListener('change', (e) => {
    onlySerious = e.target.checked;
    draw();
  });

  const load = async () => {
    try {
      rows = await listAttempts(300);
      draw();
    } catch (err) {
      $('#list', page).innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    }
  };
  load();
  return watch('attempts', load);
}

return { render };
})();

{
const { configured, fn, isAdmin, onAuth, signIn, signOut, resetPasswordEmail, setNewPassword, pendingMissionsCount, pendingRequestsCount, watch } = __m_js_api;
const { esc, icon, toast, modal, $ } = __m_js_ui;
const { startStore, stopStore, getState, subscribe } = __m_js_store;
const today = __m_js_pages_today;
const sites = __m_js_pages_sites;
const engineers = __m_js_pages_engineers;
const missions = __m_js_pages_missions;
const requests = __m_js_pages_requests;
const evaluations = __m_js_pages_evaluations;
const recruitment = __m_js_pages_recruitment;
const reports = __m_js_pages_reports;
const payroll = __m_js_pages_payroll;
const employee = __m_js_pages_employee;
const security = __m_js_pages_security;
const settings = __m_js_pages_settings;















const ROUTES = {
  today: { title: 'لوحة اليوم', icon: 'today', page: today },
  sites: { title: 'المواقع', icon: 'site', page: sites },
  engineers: { title: 'الموظفين', icon: 'users', page: engineers },
  missions: { title: 'المأموريات', icon: 'car', page: missions },
  requests: { title: 'الطلبات', icon: 'inbox', page: requests },
  reports: { title: 'التقارير', icon: 'report', page: reports },
  payroll: { title: 'الرواتب', icon: 'money', page: payroll },
  evaluations: { title: 'تقييم الأداء', icon: 'star', page: evaluations },
  recruitment: { title: 'التوظيف والمقابلات', icon: 'briefcase', page: recruitment },
  employee: { title: 'ملف الموظف', icon: 'users', page: employee, hidden: true, parent: 'engineers' },
  security: { title: 'سجل الأمان', icon: 'shield', page: security },
  settings: { title: 'الإعدادات', icon: 'settings', page: settings },
};

const root = document.getElementById('app');
let cleanup = null;
let currentUser = null;
let bootedFor = null;

const brandMark = `<div class="brand-mark"><img src="logo.png" alt="NEAP" onerror="this.remove()" /><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2.5a7 7 0 0 0-7 7c0 5.3 7 12 7 12s7-6.7 7-12a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg></div>`;

/* ---------------- screens ---------------- */

function renderNotConfigured() {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      ${brandMark}
      <h1>لوحة التحكم غير مرتبطة بعد</h1>
      <p>افتح الملف <code class="k">admin/js/config.js</code> وأضف إليه بيانات الاتصال بقاعدة البيانات.</p>
      <div class="notice">الخطوات بالتفصيل في <b>docs/SETUP_AR.md</b>.</div>
    </div></div>`;
}

function renderLogin() {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap">
      <form class="auth-card" id="login" novalidate>
        <img class="auth-logo" src="logo-full.png" alt="NEAP" />
        <h1>نظام الحضور والانصراف</h1>
        <p>تسجيل دخول الإدارة</p>
        <div class="field"><label for="email">البريد الإلكتروني</label>
          <input class="input ltr" id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="password">كلمة المرور</label>
          <input class="input ltr" id="password" type="password" autocomplete="current-password" required /></div>
        <div class="form-error" id="err"></div>
        <button class="btn primary block" type="submit">دخول</button>
        <div style="margin-top:14px;text-align:center"><a href="#" id="forgot" class="small">نسيت كلمة المرور؟</a></div>
      </form>
    </div>`;
  const form = $('#login');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    $('#err').textContent = '';
    btn.disabled = true;
    try {
      await signIn($('#email').value.trim(), $('#password').value);
    } catch (err) {
      $('#err').textContent = authError(err);
    } finally {
      btn.disabled = false;
    }
  });
  $('#forgot').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return ($('#err').textContent = 'أدخل البريد الإلكتروني أولًا.');
    try {
      await resetPasswordEmail(email);
      toast('إذا كان البريد مسجلًا فسيصلك رابط لتغيير كلمة المرور', 'ok');
    } catch (err) {
      $('#err').textContent = err.message;
    }
  });
}

function renderNotAdmin(user) {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      ${brandMark}
      <h1>هذا الحساب ليس حساب مدير</h1>
      <p class="ltr" style="text-align:right">${esc(user.email || '')}</p>
      <div class="notice" style="margin-bottom:16px">إذا كانت هذه أول مرة يُشغَّل فيها النظام، فاضغط الزر أدناه لتفعيل حسابك كأول مدير. يعمل هذا الزر مرة واحدة فقط، وبعدها يُضاف أي مدير جديد من صفحة الإعدادات.</div>
      <div class="form-error" id="err"></div>
      <button class="btn primary block" id="boot">تفعيل كأول مدير</button>
      <button class="btn block" id="out" style="margin-top:10px">تسجيل خروج</button>
    </div></div>`;
  $('#boot').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {
      await fn('bootstrap');
      toast('تم تفعيل حسابك كمدير', 'ok');
      bootedFor = null;
      await boot(user);
    } catch (err) {
      $('#err').textContent = err.message;
      e.target.disabled = false;
    }
  });
  $('#out').addEventListener('click', () => signOut());
}

function renderShell(user) {
  root.className = '';
  root.innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">${brandMark}<div><b>نظام الحضور والانصراف</b><span id="companyName"></span></div></div>
        <nav class="nav">
          ${Object.entries(ROUTES)
            .filter(([, r]) => !r.hidden)
            .map(([k, r]) => `<a href="#/${k}" data-route="${k}">${icon(r.icon)}<span>${r.title}</span>${k === 'missions' || k === 'requests' ? `<b class="count" id="${k}Count"></b>` : ''}</a>`)
            .join('')}
        </nav>
        <div class="foot">جميع الأوقات بتوقيت القاهرة</div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h2 id="pageTitle"></h2>
          <div class="who"><span class="ltr">${esc(user.email || '')}</span>
            <button class="btn sm" id="logout">${icon('logout')} خروج</button></div>
        </header>
        <main class="content" id="page"></main>
      </div>
    </div>`;
  $('#logout').addEventListener('click', () => signOut());
  const setCompany = () => {
    const el = $('#companyName');
    if (el) el.textContent = getState().settings.companyName || '';
  };
  if (!renderShell.subscribed) {
    subscribe(setCompany);
    renderShell.subscribed = true;
  }
  setCompany();
}

function route() {
  if (!currentUser || !$('#page')) return;
  const key = (location.hash.replace(/^#\/?/, '') || 'today').split('?')[0];
  const r = ROUTES[key] || ROUTES.today;
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === (r.parent || key)));
  $('#pageTitle').textContent = r.title;
  document.title = `${r.title} — نظام الحضور`;
  if (typeof cleanup === 'function') cleanup();
  cleanup = null;
  // Fresh element per route so page-level event listeners never accumulate.
  const old = $('#page');
  const page = old.cloneNode(false);
  old.replaceWith(page);
  try {
    cleanup = r.page.render(page);
  } catch (err) {
    console.error(err);
    page.innerHTML = `<div class="card card-b">حدث خطأ أثناء تحميل الصفحة: ${esc(err.message)}</div>`;
  }
}

function authError(err) {
  const msg = String(err?.message || '').toLowerCase();
  if (msg.includes('invalid login') || msg.includes('invalid credentials')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if (msg.includes('email not confirmed')) return 'البريد الإلكتروني غير مؤكد بعد.';
  if (msg.includes('rate') || msg.includes('too many')) return 'محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.';
  if (msg.includes('fetch') || msg.includes('network')) return 'مشكلة في الاتصال بالإنترنت.';
  return 'تعذّر تسجيل الدخول.';
}

async function boot(user) {
  if (bootedFor === user.id) return; // token refreshes fire auth events too
  bootedFor = user.id;
  if (!(await isAdmin(user.id))) {
    currentUser = null;
    return renderNotAdmin(user);
  }
  currentUser = user;
  renderShell(user);
  startStore();
  route();
  watchPendingMissions();
}

// Red counter next to "المأموريات" in the sidebar = requests waiting for a decision.
let stopPending = null;
function watchPendingMissions() {
  if (stopPending) stopPending();
  const update = async () => {
    const el = $('#missionsCount');
    if (el) el.textContent = (await pendingMissionsCount()) || '';
  };
  const updateReq = async () => {
    const el = $('#requestsCount');
    if (el) el.textContent = (await pendingRequestsCount()) || '';
  };
  update();
  updateReq();
  const a = watch('missions', update);
  const b = watch('requests', updateReq);
  stopPending = () => {
    a();
    b();
  };
}

function askNewPassword() {
  modal({
    title: 'كلمة مرور جديدة',
    submitLabel: 'حفظ',
    body: `<div class="field"><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label>
      <input class="input ltr" name="pw" type="password" autocomplete="new-password" /></div>`,
    onSubmit: async (form) => {
      if (form.pw.value.length < 8) throw new Error('كلمة المرور قصيرة.');
      await setNewPassword(form.pw.value);
      toast('تم تغيير كلمة المرور', 'ok');
    },
  });
}

window.addEventListener('hashchange', route);

if (!configured) {
  renderNotConfigured();
} else {
  onAuth((user, event) => {
    if (event === 'PASSWORD_RECOVERY') setTimeout(askNewPassword, 300);
    if (!user) {
      if (typeof cleanup === 'function') cleanup();
      cleanup = null;
      currentUser = null;
      bootedFor = null;
      stopStore();
      if (stopPending) stopPending();
      stopPending = null;
      return renderLogin();
    }
    // Don't await inside the auth callback (supabase-js recommendation).
    setTimeout(() => boot(user).catch((err) => {
      console.error(err);
      bootedFor = null;
      toast('تعذّر تحميل الحساب', 'bad');
    }), 0);
  });
}

}
</script>
</body>
</html>
