  <style>
/* NEP Site Attendance — admin dashboard */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #18212b;
  --ink-2: #3b4652;
  --muted: #6b7682;
  --line: #e3e7ec;
  --brand: #0f3b5f;
  --brand-2: #164e7c;
  --brand-ink: #e8f0f7;
  --accent: #f2a900;
  --ok: #15803d;
  --ok-bg: #e7f6ec;
  --warn: #b45309;
  --warn-bg: #fdf3e2;
  --bad: #c62828;
  --bad-bg: #fdecec;
  --info: #1d5fa8;
  --info-bg: #e8f1fb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 20px 40px rgba(16, 24, 40, .18);
  --font: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }

/* ---------- boot ---------- */
.boot { display: grid; place-items: center; min-height: 100vh; }
.boot-spinner, .spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--brand);
  animation: spin .8s linear infinite;
}
.spinner { width: 18px; height: 18px; border-width: 2px; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- auth screens ---------- */
.auth-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background:
    radial-gradient(1200px 600px at 100% 0%, rgba(242,169,0,.10), transparent 60%),
    linear-gradient(160deg, #0b2c47 0%, #0f3b5f 55%, #164e7c 100%);
}
.auth-card {
  width: 100%; max-width: 400px; background: var(--surface); border-radius: 16px;
  padding: 32px 28px; box-shadow: var(--shadow-lg);
}
.auth-card h1 { font-size: 20px; margin: 14px 0 4px; }
.auth-card p { margin: 0 0 22px; color: var(--muted); }
.brand-mark {
  width: 44px; height: 44px; border-radius: 11px; background: var(--brand);
  display: grid; place-items: center; color: var(--accent);
}

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--brand); color: var(--brand-ink); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
}
.brand-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: inherit; padding: 4px; display: block; }
.brand-mark img + svg { display: none; }
.auth-logo { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto 6px; }
.auth-card .brand-mark { width: 88px; height: 88px; border-radius: 18px; }
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.sidebar .brand .brand-mark { width: 36px; height: 36px; background: rgba(255,255,255,.08); }
.sidebar .brand b { display: block; font-size: 15px; color: #fff; }
.sidebar .brand span { font-size: 12px; opacity: .7; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px;
  color: var(--brand-ink); opacity: .82; font-weight: 500; text-decoration: none;
}
.nav a:hover { background: rgba(255,255,255,.06); opacity: 1; }
.nav a.active { background: rgba(255,255,255,.12); opacity: 1; color: #fff; box-shadow: inset -3px 0 0 var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.sidebar .foot { margin-top: auto; font-size: 12px; opacity: .65; padding: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar h2 { margin: 0; font-size: 18px; }
.topbar .who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.content { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; width: 100%; }

/* ---------- components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.card-h h3 { margin: 0; font-size: 15px; }
.card-b { padding: 18px; }
.card-b.flush { padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; padding: 11px; }
.btn svg { width: 16px; height: 16px; }
.card-h h3 svg { width: 18px; height: 18px; vertical-align: -3px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 500; font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(22,78,124,.12); }
.input.ltr { text-align: left; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.form-error { color: var(--bad); font-size: 13px; min-height: 18px; margin: 4px 0 10px; }

.check { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: #fff; }
.check input { accent-color: var(--brand); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { accent-color: var(--brand); width: 18px; height: 18px; }

/* tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
table.t th, table.t td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
table.t tr:last-child td { border-bottom: none; }
table.t tbody tr:hover { background: #fafbfc; }
table.t td.actions { white-space: nowrap; text-align: left; }
.person b { display: block; font-weight: 600; }
.person span { font-size: 12px; color: var(--muted); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink-2);
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.site-tile { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.site-tile h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.site-tile ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.site-tile li { padding: 2px 0; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.filters .field { margin: 0; min-width: 160px; }

/* modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 32, .5); display: grid; place-items: center;
  padding: 16px; z-index: 50; animation: fade .15s ease;
}
.modal {
  width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
}
.modal.wide { max-width: 860px; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 16px; }
.modal-b { padding: 20px; }
.modal-f { display: flex; justify-content: flex-start; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; }
@keyframes fade { from { opacity: 0; } }

.map { height: 320px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 14px; }
.selfies { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.selfies figure { margin: 0; }
.selfies img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.selfies figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: center; }

/* toasts */
#toasts { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast {
  min-width: 260px; max-width: 380px; padding: 12px 16px; border-radius: 10px; color: #fff;
  background: var(--ink); box-shadow: var(--shadow-lg); animation: fade .2s ease; font-size: 14px;
}
.toast.ok { background: var(--ok); }
.toast.bad { background: var(--bad); }

.notice { padding: 12px 14px; border-radius: 10px; background: var(--info-bg); color: var(--info); font-size: 13.5px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
code.k { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; }
  .sidebar .brand { padding: 0 4px 0 12px; }
  .sidebar .brand span, .sidebar .foot { display: none; }
  .nav { display: flex; gap: 4px; }
  .nav a { padding: 8px 10px; white-space: nowrap; }
  .topbar, .content { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-3, .selfies { grid-template-columns: 1fr; }
  table.t th, table.t td { white-space: nowrap; padding: 10px 12px; }
}

.nav .count { margin-inline-start: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.nav .count:empty { display: none; }
.mission-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; background: var(--surface); }
.mission-card .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mission-list { display: grid; gap: 12px; }

/* ---------- HR: employee file & payroll ---------- */
.hr-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi .value.bad { color: var(--bad); }
.kpi.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
.kpi.brand .label { color: var(--brand-ink); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 24px; margin: 0; }
.facts dt { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.facts dd { margin: 0; font-weight: 600; }
.balance { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.balance .bx { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }
.balance .bx span { font-size: 12.5px; color: var(--muted); }
.balance .bx b { font-size: 22px; font-variant-numeric: tabular-nums; }
.balance .bx.ok { background: var(--ok-bg); border-color: transparent; }
.balance .bx.ok b { color: var(--ok); }
.balance .bx.bad { background: var(--bad-bg); border-color: transparent; }
.balance .bx.bad b { color: var(--bad); }
table.t tr.total td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--line); }
table.t td.num { font-variant-numeric: tabular-nums; }
table.pay td.num { white-space: nowrap; }
.neg { color: var(--bad); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.slip-h { display: flex; gap: 14px; align-items: center; border-bottom: 2px solid var(--brand); padding-bottom: 10px; margin-bottom: 14px; }
.slip-h img { height: 44px; }
.slip .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 14px; }
.slip-cols { gap: 14px; align-items: start; }
.slip-cols table.t th, .slip-cols table.t td { padding: 8px 10px; }
.slip-net { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 16px; background: var(--brand); color: #fff; border-radius: 10px; font-size: 17px; }
.slip-net b { font-size: 22px; font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) { .hr-kpis, .balance { grid-template-columns: repeat(2, minmax(0, 1fr)); } .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 860px) { .facts, .slip .facts { grid-template-columns: 1fr; } }
table.t .person.wide { min-width: 230px; }
table.emp td.num, table.emp td.actions { white-space: nowrap; }
table.emp th { white-space: normal; line-height: 1.3; }
.dept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.dept { text-align: right; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.dept:hover { border-color: var(--brand); }
.dept.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--info-bg); }
.dept .dn { font-weight: 600; }
.dept b { font-size: 24px; font-variant-numeric: tabular-nums; }
.dept .dj { font-size: 12px; color: var(--muted); }
.dept.total { cursor: default; background: var(--brand); color: #fff; border-color: var(--brand); }
.dept.total .dn { color: var(--brand-ink); }
table.emp td.job { min-width: 150px; }
table.emp td.job .badge { margin-top: 4px; }
</style>

const point = (p) =>

const mapSite = (r) => ({

});

const mapEngineer = (r) => ({

  id: r.id, uid: r.uid, name: r.name, code: r.code, destination: r.destination, purpose: r.purpose,
  status: r.status, date: r.date, requestedAt: r.requested_at, decidedAt: r.decided_at, decisionNote: r.decision_note,
  startedAt: r.started_at, start: point(r.start_point), endedAt: r.ended_at, end: point(r.end_point),
  durationMinutes: r.duration_minutes, flags: r.flags || [],
});

const mapAttendance = (r) => ({
  id: r.id, uid: r.uid, name: r.name, code: r.code, siteId: r.site_id, siteName: r.site_name, date: r.date,
  status: r.status, checkInAt: r.check_in_at, checkOutAt: r.check_out_at, checkIn: point(r.check_in),
  checkOut: point(r.check_out), durationMinutes: r.duration_minutes, late: r.late, lateMinutes: r.late_minutes,
  nonWorkday: r.non_workday, flags: r.flags || [],
});

const SETTINGS_MAP = {
  companyName: 'company_name', workStart: 'work_start', workEnd: 'work_end', graceMinutes: 'grace_minutes',
  workDays: 'work_days', maxAccuracy: 'max_accuracy', missedAlertTime: 'missed_alert_time',
  dailySummaryTime: 'daily_summary_time', selfieRequired: 'selfie_required',
  allowCheckoutOutside: 'allow_checkout_outside', selfieRetentionDays: 'selfie_retention_days',
};
const mapSettings = (r) =>
  Object.fromEntries(Object.entries(SETTINGS_MAP).filter(([, col]) => r && col in r).map(([k, col]) => [k, r[col]]));
const unmapSettings = (o) =>
  Object.fromEntries(Object.entries(o).filter(([k]) => SETTINGS_MAP[k]).map(([k, v]) => [SETTINGS_MAP[k], v]));

/* ---------------- auth ---------------- */

const signIn = (email, password) =>
  sb.auth.signInWithPassword({ email, password }).then(({ error }) => {
    if (error) throw error;
  });

function modal({ title, body, submitLabel = 'حفظ', cancelLabel = 'إلغاء', wide = false, onSubmit, onOpen, danger = false, hideFooter = false }) {

    <form class="modal ${wide ? 'wide' : ''}" novalidate>

    backdrop.remove();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!onSubmit) return close();
    const btn = form.querySelector('[data-submit]');
    const err = form.querySelector('[data-error]');
    err.textContent = '';
    btn.disabled = true;
    const label = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const keep = await onSubmit(form, close);
      if (keep !== false) close();
    } catch (ex) {
      err.textContent = ex.message || 'حدث خطأ';
    } finally {
      btn.disabled = false;
      btn.innerHTML = label;
    }

  const first = form.querySelector('input:not([type=hidden]), select, textarea');
  if (first) setTimeout(() => first.focus(), 30);
  onOpen?.(form, close);
  return { el: form, close };
}

// ===== js/store.js =====
const __m_js_store = (() => {
const { listSites, listEngineers, getSettings, loadHr, watch } = __m_js_api;
// Live shared data (sites, engineers, settings) used across pages.

const DEFAULT_SETTINGS = {
  companyName: 'NEAP — نصار للهندسة',
  workStart: '08:00',
  workEnd: '17:00',
  graceMinutes: 15,
  workDays: [6, 0, 1, 2, 3, 4],
  maxAccuracy: 50,
  missedAlertTime: '09:30',
  dailySummaryTime: '18:00',
  selfieRequired: true,
  allowCheckoutOutside: true,
  selfieRetentionDays: 90,
};

const DEFAULT_PAYROLL = {
  otMultiplier: 1.5,
  dayDivisor: 30,
  deductAbsence: true,
  deductLate: true,
  insuranceEnabled: true,
  insuranceRate: 11,
  insuranceMin: 2700,
  insuranceMax: 16700,
  taxEnabled: true,
  taxPersonalExemption: 20000,
  martyrsRate: 0.05,
};

const state = {
  sites: [],
  engineers: [],
  settings: { ...DEFAULT_SETTINGS },
  hr: [],
  salaries: [],
  leaves: [],
  payrollSettings: { ...DEFAULT_PAYROLL },
  hrMissing: false,
  ready: { sites: false, engineers: false, settings: false, hr: false },
};
const subs = new Set();
let unsubs = [];

const emit = () => subs.forEach((fn) => fn(state));

async function load(key) {
  try {
    if (key === 'sites') state.sites = await listSites();
    if (key === 'engineers') state.engineers = await listEngineers();
    if (key === 'settings') state.settings = { ...DEFAULT_SETTINGS, ...(await getSettings()) };
    if (key === 'hr') {
      const h = await loadHr();
      state.hr = h.hr;
      state.salaries = h.salaries;
      state.leaves = h.leaves;
      state.payrollSettings = { ...DEFAULT_PAYROLL, ...(h.payrollSettings || {}) };
      state.hrMissing = h.missing;
    }
    state.ready[key] = true;
    emit();
  } catch (err) {
    console.error('store load failed', key, err);
  }
}

function startStore() {
  stopStore();
  ['sites', 'engineers', 'settings', 'hr'].forEach(load);
  unsubs = [
    watch('sites', () => load('sites')),
    watch('profiles', () => load('engineers')),
    watch('settings', () => load('settings')),
    ...['hr_employees', 'salary_changes', 'leaves', 'payroll_settings'].map((t) => watch(t, () => load('hr'))),
  ];
}

/** Force a refresh (e.g. right after a write, in case realtime is slow). */
const refresh = (key) => load(key);

function stopStore() {
  unsubs.forEach((u) => u());
  unsubs = [];
}

const getState = () => state;
function subscribe(fn) {
  subs.add(fn);
  return () => subs.delete(fn);
}
const siteName = (id) => state.sites.find((s) => s.id === id)?.name || '—';

const hrOf = (uid) => state.hr.find((h) => h.uid === uid) || null;
const salariesOf = (uid) => state.salaries.filter((s) => s.uid === uid);
const leavesOf = (uid) => state.leaves.filter((l) => l.uid === uid);

return { DEFAULT_SETTINGS, DEFAULT_PAYROLL, startStore, refresh, stopStore, getState, subscribe, siteName, hrOf, salariesOf, leavesOf };
})();

const __m_js_pages_sites = (() => {

const CAIRO = [30.0444, 31.2357];

function render(page) {

          <td>${count}</td>
          <td>${s.active === false ? badge('متوقف', 'bad') : badge('نشط', 'ok')}</td>
          <td class="actions">

/** Accepts "30.04, 31.23", or a Google Maps link containing @lat,lng / q=lat,lng / !3dlat!4dlng */
function parseCoords(text) {
  const t = String(text || '').trim();
  const patterns = [
    /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/,
    /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /[?&](?:q|query|ll)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /^(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)$/,
  ];
  for (const p of patterns) {
    const m = p.exec(t);
    if (m) {
      const lat = Number(m[1]);
      const lng = Number(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng };
    }
  }
  return null;
}

function openSiteModal(site) {
  const isEdit = !!site;
  const s = site || { name: '', address: '', radius: 150, lat: null, lng: null, active: true };
  let map, marker, circle;

  const m = modal({
    title: isEdit ? `تعديل: ${s.name}` : 'موقع جديد',
    wide: true,
    submitLabel: isEdit ? 'حفظ التعديلات' : 'إضافة الموقع',
    body: `
      <div class="grid-2">
        <div class="field"><label>اسم الموقع *</label><input class="input" name="siteName" value="${esc(s.name)}" required /></div>
        <div class="field"><label>العنوان / الوصف</label><input class="input" name="address" value="${esc(s.address || '')}" /></div>
      </div>
      <div class="field">
        <label>مكان الموقع *</label>
        <div class="row">
          <input class="input ltr" name="coords" style="flex:1;min-width:220px" placeholder="الصق الإحداثيات أو رابط خرائط جوجل: 30.0444, 31.2357"
            value="${s.lat != null ? `${s.lat}, ${s.lng}` : ''}" />
          <button type="button" class="btn" data-here>${icon('pin')} موقعي الحالي</button>
        </div>
        <span class="hint">أو اضغط على الخريطة. من خرائط جوجل: اضغط مطولًا على المكان وانسخ الأرقام الظاهرة.</span>
      </div>
      <div class="map" data-map></div>
      <div class="grid-2">
        <div class="field"><label>نصف قطر النطاق (متر) *</label>
          <input class="input ltr" name="radius" type="number" min="30" max="2000" step="10" value="${esc(s.radius)}" /></div>
        <div class="field"><label>الحالة</label>
          <label class="switch"><input type="checkbox" name="active" ${s.active !== false ? 'checked' : ''}/> الموقع نشط ويسمح بالتسجيل</label></div>
      </div>`,
    onOpen: (form) => {
      const mapEl = form.querySelector('[data-map]');
      if (!window.L) {
        mapEl.innerHTML = '<div class="empty">تعذّر تحميل الخريطة — استخدم الإحداثيات.</div>';
        return;
      }
      const start = s.lat != null ? [s.lat, s.lng] : CAIRO;
      map = L.map(mapEl).setView(start, s.lat != null ? 16 : 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
      }).addTo(map);
      const place = (lat, lng, pan = true) => {
        const r = Number(form.radius.value) || 150;
        if (!marker) {
          marker = L.marker([lat, lng], { draggable: true }).addTo(map);
          marker.on('dragend', () => {
            const p = marker.getLatLng();
            place(p.lat, p.lng, false);
          });
          circle = L.circle([lat, lng], { radius: r, color: '#0f3b5f', fillColor: '#f2a900', fillOpacity: 0.18, weight: 2 }).addTo(map);
        } else {
          marker.setLatLng([lat, lng]);
          circle.setLatLng([lat, lng]);
        }
        circle.setRadius(r);
        form.coords.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        if (pan) map.setView([lat, lng], Math.max(map.getZoom(), 16));
      };
      if (s.lat != null) place(s.lat, s.lng);
      map.on('click', (e) => place(e.latlng.lat, e.latlng.lng, false));
      form.coords.addEventListener('change', () => {
        const c = parseCoords(form.coords.value);
        if (c) place(c.lat, c.lng);
      });
      form.radius.addEventListener('input', () => circle && circle.setRadius(Number(form.radius.value) || 150));
      form.querySelector('[data-here]').addEventListener('click', () => {
        if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع', 'bad');
        navigator.geolocation.getCurrentPosition(
          (p) => place(p.coords.latitude, p.coords.longitude),
          () => toast('تعذّر تحديد موقعك. اسمح للمتصفح باستخدام الموقع.', 'bad'),
          { enableHighAccuracy: true, timeout: 15000 }
        );
      });
      setTimeout(() => map.invalidateSize(), 120);
    },
    onSubmit: async (form) => {
      const name = form.siteName.value.trim();
      const coords = parseCoords(form.coords.value);
      const radius = Math.round(Number(form.radius.value));
      if (name.length < 2) throw new Error('اكتب اسم الموقع.');
      if (!coords) throw new Error('حدد مكان الموقع على الخريطة أو الصق الإحداثيات.');
      if (!(radius >= 30 && radius <= 2000)) throw new Error('يجب أن يكون النطاق بين 30 و2000 متر.');
      const data = {
        name,
        address: form.address.value.trim(),
        lat: coords.lat,
        lng: coords.lng,
        radius,
        active: form.active.checked,
      };
      await saveSite(isEdit ? s.id : null, data);
      refresh('sites');
      toast(isEdit ? 'تم حفظ التعديلات' : 'تمت إضافة الموقع', 'ok');
    },
  });
  return m;
}

return { render, parseCoords };
})();

const __m_js_hr = (() => {

// HR & payroll calculations (pure functions — no DOM, no Supabase), so they can be unit-tested.

  if (getState().ready.engineers && getState().ready.hr && !getState().hrMissing) loadReport();
  return unsub;
}

const fmtNum = (n) => (Math.round(Number(n || 0) * 100) / 100).toString();
const kpi = (label, value, sub, kind = '') =>
  `<div class="card kpi"><div class="label">${label}</div><div class="value ${kind}" style="font-size:22px">${value}</div>${sub ? `<div class="muted small">${sub}</div>` : ''}</div>`;
const fact = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
const bx = (label, v, kind = '') => `<div class="bx ${kind}"><span>${label}</span><b>${fmtNum(v)}</b></div>`;

function lastRaise(sal) {
  if (sal.length < 2) return sal.length ? 'لا توجد زيادات بعد' : '—';
  const a = sal[sal.length - 2];
  const b = sal[sal.length - 1];
  const before = a.basicSalary + a.allowances;
  const after = b.basicSalary + b.allowances;
  const pct = before ? ` (${fmtNum(((after - before) / before) * 100)}%)` : '';
  return `<span style="font-size:18px">${money(after - before)}${pct}</span><div class="muted small">في ${b.effectiveDate}</div>`;
}

function salaryTable(sal) {
  if (!sal.length) return `<div class="empty">لم يُسجَّل راتب بعد — اضغط "تسجيل زيادة / تعديل راتب" وأدخل الراتب عند التعيين.</div>`;
  return `<table class="t"><thead><tr><th>من تاريخ</th><th>الأساسي</th><th>البدلات</th><th>الإجمالي</th><th>التغيير</th><th>ملاحظة</th><th></th></tr></thead><tbody>${[...sal]
    .reverse()
    .map((s, i, arr) => {
      const prev = arr[i + 1];
      const total = s.basicSalary + s.allowances;
      const ptotal = prev ? prev.basicSalary + prev.allowances : null;
      const diff = prev ? total - ptotal : null;
      return `<tr><td class="num ltr">${s.effectiveDate}</td><td class="num">${money(s.basicSalary)}</td><td class="num">${money(s.allowances)}</td>
        <td class="num"><b>${money(total)}</b></td>
        <td class="num">${diff == null ? badge('عند التعيين', 'info') : badge(`${diff >= 0 ? '+' : ''}${money(diff)}${ptotal ? ` (${fmtNum((diff / ptotal) * 100)}%)` : ''}`, diff >= 0 ? 'ok' : 'bad')}</td>
        <td>${esc(s.note)}</td><td class="actions"><button class="btn sm ghost" data-del-salary="${esc(s.id)}" title="حذف">${icon('trash')}</button></td></tr>`;
    })
    .join('')}</tbody></table>`;
}

function leaveTable(lv) {
  if (!lv.length) return `<div class="empty">لا توجد إجازات مسجلة.</div>`;
  return `<table class="t"><thead><tr><th>النوع</th><th>من</th><th>إلى</th><th>الأيام</th><th>ملاحظة</th><th></th></tr></thead><tbody>${lv
    .map((l) => `<tr><td>${badge(LEAVE_KINDS[l.kind]?.label || l.kind, l.kind === 'unpaid' ? 'warn' : LEAVE_KINDS[l.kind]?.fromBalance ? 'info' : '')}</td>
      <td class="num ltr">${l.startDate}</td><td class="num ltr">${l.endDate}</td><td class="num">${fmtNum(l.days)}</td><td>${esc(l.note)}</td>
      <td class="actions"><button class="btn sm ghost" data-del-leave="${esc(l.id)}" title="حذف">${icon('trash')}</button></td></tr>`)
    .join('')}</tbody></table>`;
}

function openLeaveModal(e) {
  const today = todayKey();
  const bal = leaveBalance(hrOf(e.id) || {}, leavesOf(e.id), today);
  modal({
    title: `تسجيل إجازة — ${e.name}`,
    body: `
      <div class="field"><label>نوع الإجازة</label><select class="input" name="kind">
        ${Object.entries(LEAVE_KINDS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select>
        <span class="hint">الرصيد المتبقي: ${fmtNum(bal.remaining)} يوم. المرضية لا تُخصم من الرصيد، والإجازة بدون أجر تُخصم من الراتب.</span></div>
      <div class="grid-2">
        <div class="field"><label>من</label><input class="input ltr" type="date" name="from" value="${today}" required /></div>
        <div class="field"><label>إلى</label><input class="input ltr" type="date" name="to" value="${today}" required /></div>
      </div>
      <div class="field"><label>عدد الأيام (أيام العمل فقط)</label><input class="input ltr" type="number" step="0.5" min="0" name="days" /></div>
      <div class="field"><label>ملاحظة</label><input class="input" name="note" /></div>`,
    onOpen: (f) => {
      const calc = () => {
        if (f.from.value && f.to.value && f.to.value >= f.from.value) {
          f.days.value = workdaysBetween(f.from.value, f.to.value, getState().settings.workDays || []).length;
        }
      };
      f.from.addEventListener('change', () => {
        if (f.to.value < f.from.value) f.to.value = f.from.value;
        calc();
      });
      f.to.addEventListener('change', calc);
      calc();
    },
    onSubmit: async (f) => {
      if (!f.from.value || !f.to.value || f.to.value < f.from.value) throw new Error('راجع التواريخ.');
      const days = Number(f.days.value);
      if (!(days >= 0)) throw new Error('أدخل عدد الأيام.');
      if (LEAVE_KINDS[f.kind.value].fromBalance && days > bal.remaining) {
        const ok = await confirmDialog('الرصيد لا يكفي', `الرصيد المتبقي ${fmtNum(bal.remaining)} يوم فقط. هل تريد التسجيل على أي حال؟`, { confirmLabel: 'تسجيل' });
        if (!ok) return false;
      }
      await addLeave(e.id, { kind: f.kind.value, startDate: f.from.value, endDate: f.to.value, days, note: f.note.value.trim() });
      refresh('hr');
      toast('تم تسجيل الإجازة', 'ok');
    },
  });
}

function exportFile(e, list) {
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمّل، تأكد من الإنترنت', 'bad');
  const hr = hrOf(e.id) || {};
  const today = todayKey();
  const bal = leaveBalance(hr, leavesOf(e.id), today);
  const cur = salaryOn(salariesOf(e.id), today);
  const info = [
    { 'البند': 'الاسم', 'القيمة': e.name }, { 'البند': 'الكود', 'القيمة': e.code },
    { 'البند': 'الوظيفة', 'القيمة': hr.jobTitle || '' }, { 'البند': 'تاريخ التعيين', 'القيمة': hr.hireDate || '' },
    { 'البند': 'الراتب الأساسي الحالي', 'القيمة': cur?.basicSalary ?? '' }, { 'البند': 'البدلات الحالية', 'القيمة': cur?.allowances ?? '' },
    { 'البند': `رصيد الإجازات المتبقي ${bal.year}`, 'القيمة': bal.remaining }, { 'البند': 'المستحق السنوي', 'القيمة': leaveEntitlement(hr, today) },
  ];
  const sal = salariesOf(e.id).map((s) => ({ 'من تاريخ': s.effectiveDate, 'الأساسي': s.basicSalary, 'البدلات': s.allowances, 'الإجمالي': s.basicSalary + s.allowances, 'ملاحظة': s.note }));
  const lv = leavesOf(e.id).map((l) => ({ 'النوع': LEAVE_KINDS[l.kind]?.label || l.kind, 'من': l.startDate, 'إلى': l.endDate, 'الأيام': l.days, 'ملاحظة': l.note }));
  const rep = list.map((r) => ({
    'الشهر': monthLabel(r.m), 'أيام العمل': r.workdays, 'أيام الحضور': r.presentDays, 'الغياب': r.absent, 'إجازة مدفوعة': r.paidLeave,
    'بدون أجر': r.unpaid, 'مأموريات': r.missionDays, 'أيام التأخير': r.lateDays, 'دقائق التأخير': r.lateMinutes,
    'ساعات العمل': Number(fmtHours(r.totalMinutes)), 'ساعات إضافية': Number(fmtHours(r.overtimeMinutes)),
  }));
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  for (const [name, data] of [['البيانات', info], ['الراتب والزيادات', sal], ['الإجازات', lv], ['الحضور الشهري', rep]]) {
    const ws = XLSX.utils.json_to_sheet(data.length ? data : [{ '': 'لا توجد بيانات' }]);
    ws['!cols'] = Object.keys(data[0] || { a: 1 }).map((k) => ({ wch: Math.max(14, k.length + 6) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  XLSX.writeFile(wb, `ملف_${e.code}_${today}.xlsx`);
}

const DEFAULT_DEPARTMENTS = ['الهندسة والمواقع', 'الإدارة', 'الحسابات', 'الموارد البشرية', 'المشتريات', 'المكتب الفني'];

/** <datalist>s of known departments and job titles (suggestions; any text is allowed). */
function hrDatalists() {
  const hr = getState().hr;
  const uniq = (xs) => [...new Set(xs.map((x) => String(x || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ar'));
  const depts = uniq([...DEFAULT_DEPARTMENTS, ...hr.map((h) => h.department)]);
  const jobs = uniq(hr.map((h) => h.jobTitle));
  return `<datalist id="deptList">${depts.map((d) => `<option value="${esc(d)}"></option>`).join('')}</datalist>
    <datalist id="jobList">${jobs.map((d) => `<option value="${esc(d)}"></option>`).join('')}</datalist>`;
}

return { money, monthLabel, serviceText, hrSettings, countFrom, render, openHrModal, openRaiseModal, openLeaveModal, DEFAULT_DEPARTMENTS, hrDatalists };

function genPassword() {
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  const arr = new Uint32Array(8);
  crypto.getRandomValues(arr);
  return [...arr].map((n) => chars[n % chars.length]).join('');
}

}

function exportEmployees(list, groups) {
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمّل، تأكد من الإنترنت', 'bad');
  const today = todayKey();
  const rows = list.map((e) => {
    const hr = hrOf(e.id) || {};
    const sal = salaryOn(salariesOf(e.id), today);
    return {
      'الكود': e.code, 'الاسم': e.name, 'الوظيفة': hr.jobTitle || '', 'القسم': hr.department || '',
      'تاريخ التعيين': hr.hireDate || '', 'الراتب الأساسي': sal?.basicSalary ?? '', 'البدلات': sal?.allowances ?? '',
      'رصيد الإجازات': leaveBalance(hr, leavesOf(e.id), today).remaining, 'الحالة': e.active ? 'نشط' : 'موقوف',
    };
  });
  const byDept = groups.map((g) => ({
    'القسم': g.name === '—' ? 'بدون قسم' : g.name, 'عدد الموظفين': g.count,
    'الوظائف': [...g.jobs].map(([j, n]) => `${j} (${n})`).join('، '),
  }));
  byDept.push({ 'القسم': 'الإجمالي', 'عدد الموظفين': groups.reduce((a, g) => a + g.count, 0), 'الوظائف': '' });
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  for (const [name, data] of [['الموظفون', rows], ['حسب القسم', byDept]]) {
    const ws = XLSX.utils.json_to_sheet(data.length ? data : [{ '': 'لا توجد بيانات' }]);
    ws['!cols'] = Object.keys(data[0] || { a: 1 }).map((k) => ({ wch: Math.max(14, k.length + 8) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  XLSX.writeFile(wb, `الموظفون_${today}.xlsx`);
}

return { render };
})();

/** Aggregates attendance rows into a per-engineer payroll-ready summary. */
function compute(rows, from, to, engFilter, siteFilter) {
  const { engineers, settings } = getState();
  const start = parseHHMM(settings.workStart) ?? 480;
  const end = parseHHMM(settings.workEnd) ?? 1020;
  const standard = Math.max(0, end - start);
  const workDays = settings.workDays || [];
  const lastDay = to < todayKey() ? to : todayKey();

  const workdayKeys = [];
  for (let k = from; k <= lastDay; k = addDaysKey(k, 1)) {
    if (workDays.includes(weekdayIndexOfKey(k))) workdayKeys.push(k);
  }

  const people = new Map();
  const ensure = (uid, name, code) => {
    if (!people.has(uid)) people.set(uid, { uid, name, code, days: new Map(), late: new Map(), noCheckout: 0 });
    return people.get(uid);
  };
  if (!siteFilter) {
    engineers
      .filter((e) => (engFilter ? e.id === engFilter : e.active))
      .forEach((e) => ensure(e.id, e.name, e.code));
  }

  for (const r of rows) {
    const p = ensure(r.uid, r.name, r.code);
    const minutes = r.durationMinutes || 0;
    const d = p.days.get(r.date) || { minutes: 0, nonWorkday: !!r.nonWorkday };
    d.minutes += minutes;
    p.days.set(r.date, d);
    if (r.late) p.late.set(r.date, Math.max(p.late.get(r.date) || 0, r.lateMinutes || 0));
    if (r.status === 'auto_closed' || (r.flags || []).includes('no_checkout')) p.noCheckout += 1;
  }

  const summary = [...people.values()].map((p) => {
    const eng = engineers.find((e) => e.id === p.uid);
    const created = eng?.createdAt ? dateKey(toDate(eng.createdAt)) : from;
    const expected = workdayKeys.filter((k) => k >= created);
    let presentWork = 0;
    let offDaysWorked = 0;
    let totalMinutes = 0;
    let overtimeMinutes = 0;
    for (const [key, d] of p.days) {
      const isWork = workDays.includes(weekdayIndexOfKey(key));
      totalMinutes += d.minutes;
      if (isWork) {
        presentWork += 1;
        overtimeMinutes += Math.max(0, d.minutes - standard);
      } else {
        offDaysWorked += 1;
        overtimeMinutes += d.minutes;
      }
    }
    const absentDays = siteFilter ? null : Math.max(0, expected.length - expected.filter((k) => p.days.has(k)).length);
    return {
      uid: p.uid,
      name: p.name || eng?.name || '—',
      code: p.code || eng?.code || '',
      presentDays: p.days.size,
      presentWork,
      absentDays,
      lateDays: p.late.size,
      lateMinutes: [...p.late.values()].reduce((a, b) => a + b, 0),
      totalMinutes,
      overtimeMinutes,
      offDaysWorked,
      noCheckout: p.noCheckout,
    };
  });
  summary.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar'));
  return { summary, workdayCount: workdayKeys.length };
}

return { render, compute };
})();

function exportExcel(lines, month) {
  if (!window.XLSX) return toast('مكتبة Excel لم تُحمّل، تأكد من الإنترنت', 'bad');
  if (!lines.length) return;
  const rows = lines.map(({ e, hr, p, adj }) => ({
    'الكود': e.code, 'الاسم': e.name, 'الوظيفة': hr.jobTitle || '', 'القسم': hr.department || '', 'الأساسي': p.basic, 'البدلات': p.allowances,
    'أيام الاستحقاق': p.payDays, 'المستحق': p.earned, 'ساعات إضافية': p.otHours, 'قيمة الإضافي': p.otPay, 'مكافأة': p.bonus,
    'إجمالي المستحقات': p.gross, 'أيام الغياب': p.absent, 'خصم الغياب': p.absenceDed, 'أيام بدون أجر': p.unpaid,
    'خصم بدون أجر': p.unpaidDed, 'دقائق التأخير': p.lateMinutes, 'خصم التأخير': p.lateDed, 'أجر الاشتراك': p.insWage,
    'التأمينات': p.insurance, 'ضريبة كسب العمل': p.tax, 'صندوق الشهداء': p.martyrs, 'خصومات أخرى': p.otherDed, 'سلف': p.advance,
    'إجمالي الاستقطاعات': p.totalDed, 'الصافي': p.net, 'ملاحظة': adj.note || '',
  }));
  const totals = { 'الكود': '', 'الاسم': 'الإجمالي' };
  for (const k of Object.keys(rows[0])) if (typeof rows[0][k] === 'number' && k !== 'أيام الاستحقاق') totals[k] = Math.round(rows.reduce((a, r) => a + r[k], 0) * 100) / 100;
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  const ws = XLSX.utils.json_to_sheet([...rows, totals]);
  ws['!cols'] = Object.keys(rows[0]).map((k) => ({ wch: Math.max(12, k.length + 4) }));
  XLSX.utils.book_append_sheet(wb, ws, 'كشف الرواتب');
  XLSX.writeFile(wb, `كشف_رواتب_${month}.xlsx`);
}

return { render };
})();

const __m_js_pages_security = (() => {
const { listAttempts, watch } = __m_js_api;
const { esc, $, badge, fmtDateTime, REASON_LABELS, TYPE_LABELS, mapsLink } = __m_js_ui;


const SERIOUS = new Set(['mock_location', 'device_mismatch']);

function render(page) {
  let rows = [];
  let onlySerious = false;

  page.innerHTML = `
    <div class="notice">هنا جميع محاولات التسجيل المرفوضة. يصلك إشعار فوري على تليجرام بمحاولات <b>تزييف الموقع</b> و<b>الهاتف غير المسجل</b>.</div>
    <section class="card">
      <div class="card-h"><h3>المحاولات المرفوضة (آخر 300)</h3>
        <label class="switch small"><input type="checkbox" id="serious" /> المحاولات الخطيرة فقط</label></div>
      <div class="card-b flush table-wrap" id="list"><div class="empty"><span class="spinner"></span></div></div>
    </section>`;

  const draw = () => {
    const list = onlySerious ? rows.filter((r) => SERIOUS.has(r.reason)) : rows;
    $('#list', page).innerHTML = list.length
      ? `<table class="t"><thead><tr><th>الوقت</th><th>الموظف</th><th>العملية</th><th>السبب</th><th>التفاصيل</th></tr></thead><tbody>${list
          .map((r) => {
            const [label, kind] = REASON_LABELS[r.reason] || [r.reason, ''];
            return `<tr>
              <td class="num">${fmtDateTime(r.createdAt)}</td>
              <td class="person"><b>${esc(r.name || 'غير معروف')}</b><span class="ltr">${esc(r.code || '')}</span></td>
              <td>${esc(TYPE_LABELS[r.type] || r.type || '')}</td>
              <td>${badge(label, kind)}</td>
              <td class="small">${esc(r.message || '')} ${r.accuracy != null ? `<span class="muted">· دقة ±${Math.round(r.accuracy)} م</span>` : ''}
                ${mapsLink(r.lat, r.lng, 'الموقع ↗')}</td></tr>`;
          })
          .join('')}</tbody></table>`
      : `<div class="empty">لا توجد محاولات مرفوضة 👍</div>`;
  };

  $('#serious', page).addEventListener('change', (e) => {
    onlySerious = e.target.checked;
    draw();
  });

  const load = async () => {
    try {
      rows = await listAttempts(300);
      draw();
    } catch (err) {
      $('#list', page).innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    }
  };
  load();
  return watch('attempts', load);
}

return { render };
})();

  engineers: { title: 'الموظفين', icon: 'users', page: engineers },
  missions: { title: 'المأموريات', icon: 'car', page: missions },
  reports: { title: 'التقارير', icon: 'report', page: reports },
  payroll: { title: 'الرواتب', icon: 'money', page: payroll },
  employee: { title: 'ملف الموظف', icon: 'users', page: employee, hidden: true, parent: 'engineers' },
  security: { title: 'سجل الأمان', icon: 'shield', page: security },
  settings: { title: 'الإعدادات', icon: 'settings', page: settings },
};

const root = document.getElementById('app');
let cleanup = null;
let currentUser = null;
let bootedFor = null;

const brandMark = `<div class="brand-mark"><img src="logo.png" alt="NEAP" onerror="this.remove()" /><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2.5a7 7 0 0 0-7 7c0 5.3 7 12 7 12s7-6.7 7-12a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg></div>`;

/* ---------------- screens ---------------- */

function renderNotConfigured() {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      ${brandMark}
      <h1>لوحة التحكم غير مرتبطة بعد</h1>
      <p>افتح الملف <code class="k">admin/js/config.js</code> وأضف إليه بيانات الاتصال بقاعدة البيانات.</p>
      <div class="notice">الخطوات بالتفصيل في <b>docs/SETUP_AR.md</b>.</div>
    </div></div>`;
}

function renderLogin() {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap">
      <form class="auth-card" id="login" novalidate>
        <img class="auth-logo" src="logo-full.png" alt="NEAP" />
        <h1>نظام الحضور والانصراف</h1>
        <p>تسجيل دخول الإدارة</p>
        <div class="field"><label for="email">البريد الإلكتروني</label>
          <input class="input ltr" id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="password">كلمة المرور</label>
          <input class="input ltr" id="password" type="password" autocomplete="current-password" required /></div>
        <div class="form-error" id="err"></div>
        <button class="btn primary block" type="submit">دخول</button>
        <div style="margin-top:14px;text-align:center"><a href="#" id="forgot" class="small">نسيت كلمة المرور؟</a></div>
      </form>
    </div>`;
  const form = $('#login');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    $('#err').textContent = '';
    btn.disabled = true;
    try {
      await signIn($('#email').value.trim(), $('#password').value);
    } catch (err) {
      $('#err').textContent = authError(err);
    } finally {
      btn.disabled = false;
    }
  });
  $('#forgot').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return ($('#err').textContent = 'أدخل البريد الإلكتروني أولًا.');
    try {
      await resetPasswordEmail(email);
      toast('إذا كان البريد مسجلًا فسيصلك رابط لتغيير كلمة المرور', 'ok');
    } catch (err) {
      $('#err').textContent = err.message;
    }
  });
}

function renderNotAdmin(user) {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      ${brandMark}
      <h1>هذا الحساب ليس حساب مدير</h1>
      <p class="ltr" style="text-align:right">${esc(user.email || '')}</p>
      <div class="notice" style="margin-bottom:16px">إذا كانت هذه أول مرة يُشغَّل فيها النظام، فاضغط الزر أدناه لتفعيل حسابك كأول مدير. يعمل هذا الزر مرة واحدة فقط، وبعدها يُضاف أي مدير جديد من صفحة الإعدادات.</div>
      <div class="form-error" id="err"></div>
      <button class="btn primary block" id="boot">تفعيل كأول مدير</button>
      <button class="btn block" id="out" style="margin-top:10px">تسجيل خروج</button>
    </div></div>`;
  $('#boot').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {
      await fn('bootstrap');
      toast('تم تفعيل حسابك كمدير', 'ok');
      bootedFor = null;
      await boot(user);
    } catch (err) {
      $('#err').textContent = err.message;
      e.target.disabled = false;
    }
  });
  $('#out').addEventListener('click', () => signOut());
}

function renderShell(user) {
  root.className = '';
  root.innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">${brandMark}<div><b>نظام الحضور والانصراف</b><span id="companyName"></span></div></div>
        <nav class="nav">
          ${Object.entries(ROUTES)
            .filter(([, r]) => !r.hidden)
            .map(([k, r]) => `<a href="#/${k}" data-route="${k}">${icon(r.icon)}<span>${r.title}</span>${k === 'missions' ? '<b class="count" id="missionsCount"></b>' : ''}</a>`)
            .join('')}
        </nav>
        <div class="foot">جميع الأوقات بتوقيت القاهرة</div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h2 id="pageTitle"></h2>
          <div class="who"><span class="ltr">${esc(user.email || '')}</span>
            <button class="btn sm" id="logout">${icon('logout')} خروج</button></div>
        </header>
        <main class="content" id="page"></main>
      </div>
    </div>`;
  $('#logout').addEventListener('click', () => signOut());
  const setCompany = () => {
    const el = $('#companyName');
    if (el) el.textContent = getState().settings.companyName || '';
  };
  if (!renderShell.subscribed) {
    subscribe(setCompany);
    renderShell.subscribed = true;
  }
  setCompany();
}

function route() {
  if (!currentUser || !$('#page')) return;
  const key = (location.hash.replace(/^#\/?/, '') || 'today').split('?')[0];
  const r = ROUTES[key] || ROUTES.today;
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === (r.parent || key)));
  $('#pageTitle').textContent = r.title;
  document.title = `${r.title} — نظام الحضور`;
  if (typeof cleanup === 'function') cleanup();
  cleanup = null;
  // Fresh element per route so page-level event listeners never accumulate.
  const old = $('#page');
  const page = old.cloneNode(false);
  old.replaceWith(page);
  try {
    cleanup = r.page.render(page);
  } catch (err) {
    console.error(err);
    page.innerHTML = `<div class="card card-b">حدث خطأ أثناء تحميل الصفحة: ${esc(err.message)}</div>`;
  }
}

function authError(err) {
  const msg = String(err?.message || '').toLowerCase();
  if (msg.includes('invalid login') || msg.includes('invalid credentials')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if (msg.includes('email not confirmed')) return 'البريد الإلكتروني غير مؤكد بعد.';
  if (msg.includes('rate') || msg.includes('too many')) return 'محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.';
  if (msg.includes('fetch') || msg.includes('network')) return 'مشكلة في الاتصال بالإنترنت.';
  return 'تعذّر تسجيل الدخول.';
}

async function boot(user) {
  if (bootedFor === user.id) return; // token refreshes fire auth events too
  bootedFor = user.id;
  if (!(await isAdmin(user.id))) {
    currentUser = null;
    return renderNotAdmin(user);
  }
  currentUser = user;
  renderShell(user);
  startStore();
  route();
  watchPendingMissions();
}

// Red counter next to "المأموريات" in the sidebar = requests waiting for a decision.
let stopPending = null;
function watchPendingMissions() {
  if (stopPending) stopPending();
  const update = async () => {
    const el = $('#missionsCount');
    if (el) el.textContent = (await pendingMissionsCount()) || '';
  };
  update();
  stopPending = watch('missions', update);
}

function askNewPassword() {
  modal({
    title: 'كلمة مرور جديدة',
    submitLabel: 'حفظ',
    body: `<div class="field"><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label>
      <input class="input ltr" name="pw" type="password" autocomplete="new-password" /></div>`,
    onSubmit: async (form) => {
      if (form.pw.value.length < 8) throw new Error('كلمة المرور قصيرة.');
      await setNewPassword(form.pw.value);
      toast('تم تغيير كلمة المرور', 'ok');
    },
  });
}

window.addEventListener('hashchange', route);

if (!configured) {
  renderNotConfigured();
} else {
  onAuth((user, event) => {
    if (event === 'PASSWORD_RECOVERY') setTimeout(askNewPassword, 300);
    if (!user) {
      if (typeof cleanup === 'function') cleanup();
      cleanup = null;
      currentUser = null;
      bootedFor = null;
      stopStore();
      if (stopPending) stopPending();
      stopPending = null;
      return renderLogin();
    }
    // Don't await inside the auth callback (supabase-js recommendation).
    setTimeout(() => boot(user).catch((err) => {
      console.error(err);
      bootedFor = null;
      toast('تعذّر تحميل الحساب', 'bad');
    }), 0);
  });
}

}
</script>
</body>
</html>
