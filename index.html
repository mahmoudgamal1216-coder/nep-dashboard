  <style>
/* NEP Site Attendance — admin dashboard */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #18212b;
  --ink-2: #3b4652;
  --muted: #6b7682;
  --line: #e3e7ec;
  --brand: #0f3b5f;
  --brand-2: #164e7c;
  --brand-ink: #e8f0f7;
  --accent: #f2a900;
  --ok: #15803d;
  --ok-bg: #e7f6ec;
  --warn: #b45309;
  --warn-bg: #fdf3e2;
  --bad: #c62828;
  --bad-bg: #fdecec;
  --info: #1d5fa8;
  --info-bg: #e8f1fb;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 20px 40px rgba(16, 24, 40, .18);
  --font: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.hidden { display: none !important; }

/* ---------- boot ---------- */
.boot { display: grid; place-items: center; min-height: 100vh; }
.boot-spinner, .spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--brand);
  animation: spin .8s linear infinite;
}
.spinner { width: 18px; height: 18px; border-width: 2px; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- auth screens ---------- */
.auth-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background:
    radial-gradient(1200px 600px at 100% 0%, rgba(242,169,0,.10), transparent 60%),
    linear-gradient(160deg, #0b2c47 0%, #0f3b5f 55%, #164e7c 100%);
}
.auth-card {
  width: 100%; max-width: 400px; background: var(--surface); border-radius: 16px;
  padding: 32px 28px; box-shadow: var(--shadow-lg);
}
.auth-card h1 { font-size: 20px; margin: 14px 0 4px; }
.auth-card p { margin: 0 0 22px; color: var(--muted); }
.brand-mark {
  width: 44px; height: 44px; border-radius: 11px; background: var(--brand);
  display: grid; place-items: center; color: var(--accent);
}

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--brand); color: var(--brand-ink); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
}
.sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.sidebar .brand .brand-mark { width: 36px; height: 36px; background: rgba(255,255,255,.08); }
.sidebar .brand b { display: block; font-size: 15px; color: #fff; }
.sidebar .brand span { font-size: 12px; opacity: .7; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px;
  color: var(--brand-ink); opacity: .82; font-weight: 500; text-decoration: none;
}
.nav a:hover { background: rgba(255,255,255,.06); opacity: 1; }
.nav a.active { background: rgba(255,255,255,.12); opacity: 1; color: #fff; box-shadow: inset -3px 0 0 var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.sidebar .foot { margin-top: auto; font-size: 12px; opacity: .65; padding: 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.topbar h2 { margin: 0; font-size: 18px; }
.topbar .who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.content { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; width: 100%; }

/* ---------- components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 18px; border-bottom: 1px solid var(--line);
}
.card-h h3 { margin: 0; font-size: 15px; }
.card-b { padding: 18px; }
.card-b.flush { padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; }
.kpi .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; padding: 11px; }
.btn svg { width: 16px; height: 16px; }
.card-h h3 svg { width: 18px; height: 18px; vertical-align: -3px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 500; font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(22,78,124,.12); }
.input.ltr { text-align: left; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.form-error { color: var(--bad); font-size: 13px; min-height: 18px; margin: 4px 0 10px; }

.check { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: #fff; }
.check input { accent-color: var(--brand); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { accent-color: var(--brand); width: 18px; height: 18px; }

/* tables */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; }
table.t th, table.t td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
table.t tr:last-child td { border-bottom: none; }
table.t tbody tr:hover { background: #fafbfc; }
table.t td.actions { white-space: nowrap; text-align: left; }
.person b { display: block; font-weight: 600; }
.person span { font-size: 12px; color: var(--muted); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }

.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink-2);
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.site-tile { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.site-tile h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.site-tile ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--ink-2); }
.site-tile li { padding: 2px 0; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.filters .field { margin: 0; min-width: 160px; }

/* modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 23, 32, .5); display: grid; place-items: center;
  padding: 16px; z-index: 50; animation: fade .15s ease;
}
.modal {
  width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
}
.modal.wide { max-width: 860px; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 16px; }
.modal-b { padding: 20px; }
.modal-f { display: flex; justify-content: flex-start; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; }
@keyframes fade { from { opacity: 0; } }

.map { height: 320px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 14px; }
.selfies { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.selfies figure { margin: 0; }
.selfies img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; background: var(--surface-2); }
.selfies figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: center; }

/* toasts */
#toasts { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast {
  min-width: 260px; max-width: 380px; padding: 12px 16px; border-radius: 10px; color: #fff;
  background: var(--ink); box-shadow: var(--shadow-lg); animation: fade .2s ease; font-size: 14px;
}
.toast.ok { background: var(--ok); }
.toast.bad { background: var(--bad); }

.notice { padding: 12px 14px; border-radius: 10px; background: var(--info-bg); color: var(--info); font-size: 13.5px; }
.notice.warn { background: var(--warn-bg); color: var(--warn); }
code.k { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; }
  .sidebar .brand { padding: 0 4px 0 12px; }
  .sidebar .brand span, .sidebar .foot { display: none; }
  .nav { display: flex; gap: 4px; }
  .nav a { padding: 8px 10px; white-space: nowrap; }
  .topbar, .content { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-3, .selfies { grid-template-columns: 1fr; }
  table.t th, table.t td { white-space: nowrap; padding: 10px 12px; }
}

.nav .count { margin-inline-start: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.nav .count:empty { display: none; }
.mission-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; background: var(--surface); }
.mission-card .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mission-list { display: grid; gap: 12px; }
</style>

<body>
  <div id="app" class="boot">
    <div class="boot-spinner" aria-label="جاري التحميل"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ===== js/config.js =====
const __m_js_config = (() => {

// ⚙️ Supabase connection — replace with YOUR project's values.
// Supabase Dashboard → Project Settings → API (or "Connect"):
//   SUPABASE_URL  = Project URL            (https://xxxxxxxx.supabase.co)
//   SUPABASE_KEY  = anon / publishable key  (safe to expose; security is enforced by RLS)
// ⚠️ NEVER put the service_role / secret key here.
const SUPABASE_URL = 'https://wpxvcmyenbfcjumjbhld.supabase.co';
const SUPABASE_KEY = 'sb_publishable_r91Y74I1bIFzptG_vuA3Fw_SsGcv6QR';

return { SUPABASE_URL, SUPABASE_KEY };
})();

// ===== js/api.js =====
const __m_js_api = (() => {
const { SUPABASE_URL, SUPABASE_KEY } = __m_js_config;
// Data layer: everything the dashboard needs from Supabase, mapped to simple camelCase objects.


const configured = !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_KEY.includes('YOUR-');

const sb = createClient(
  configured ? SUPABASE_URL : 'https://placeholder.supabase.co',
  configured ? SUPABASE_KEY : 'placeholder',
  { auth: { persistSession: true, autoRefreshToken: true } }
);

const must = ({ data, error }) => {
  if (error) throw new Error(error.message || 'حصل خطأ في قاعدة البيانات');
  return data;
};

/* ---------------- mappers ---------------- */

const point = (p) =>
  p ? { lat: p.lat, lng: p.lng, accuracy: p.accuracy, distance: p.distance, selfiePath: p.selfie_path } : null;

const mapSite = (r) => ({
  id: r.id, name: r.name, address: r.address, lat: r.lat, lng: r.lng, radius: r.radius, active: r.active,
});

const mapEngineer = (r) => ({
  id: r.id, name: r.name, code: r.code, phone: r.phone, siteIds: r.site_ids || [], active: r.active,
  deviceId: r.device_id, createdAt: r.created_at, role: r.role, missionsAllowed: r.missions_allowed === true,
});

const mapMission = (r) => ({
  id: r.id, uid: r.uid, name: r.name, code: r.code, destination: r.destination, purpose: r.purpose,
  status: r.status, date: r.date, requestedAt: r.requested_at, decidedAt: r.decided_at, decisionNote: r.decision_note,
  startedAt: r.started_at, start: point(r.start_point), endedAt: r.ended_at, end: point(r.end_point),
  durationMinutes: r.duration_minutes, flags: r.flags || [],
});

const mapAttendance = (r) => ({
  id: r.id, uid: r.uid, name: r.name, code: r.code, siteId: r.site_id, siteName: r.site_name, date: r.date,
  status: r.status, checkInAt: r.check_in_at, checkOutAt: r.check_out_at, checkIn: point(r.check_in),
  checkOut: point(r.check_out), durationMinutes: r.duration_minutes, late: r.late, lateMinutes: r.late_minutes,
  nonWorkday: r.non_workday, flags: r.flags || [],
});

const SETTINGS_MAP = {
  companyName: 'company_name', workStart: 'work_start', workEnd: 'work_end', graceMinutes: 'grace_minutes',
  workDays: 'work_days', maxAccuracy: 'max_accuracy', missedAlertTime: 'missed_alert_time',
  dailySummaryTime: 'daily_summary_time', selfieRequired: 'selfie_required',
  allowCheckoutOutside: 'allow_checkout_outside', selfieRetentionDays: 'selfie_retention_days',
};
const mapSettings = (r) =>
  Object.fromEntries(Object.entries(SETTINGS_MAP).filter(([, col]) => r && col in r).map(([k, col]) => [k, r[col]]));
const unmapSettings = (o) =>
  Object.fromEntries(Object.entries(o).filter(([k]) => SETTINGS_MAP[k]).map(([k, v]) => [SETTINGS_MAP[k], v]));

/* ---------------- auth ---------------- */

const signIn = (email, password) =>
  sb.auth.signInWithPassword({ email, password }).then(({ error }) => {
    if (error) throw error;
  });
const signOut = () => sb.auth.signOut();
const resetPasswordEmail = (email) =>
  sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(must);
const setNewPassword = (password) => sb.auth.updateUser({ password }).then(must);

/** cb(user|null, event) */
function onAuth(cb) {
  const { data } = sb.auth.onAuthStateChange((event, session) => cb(session?.user ?? null, event));
  return () => data.subscription.unsubscribe();
}

async function isAdmin(uid) {
  const { data } = await sb.from('profiles').select('role, active').eq('id', uid).maybeSingle();
  return data?.role === 'admin' && data.active === true;
}

/** Calls the `api/admin` Edge Function route. Throws Error with the Arabic message from the server. */
async function fn(action, params = {}) {
  const { data, error } = await sb.functions.invoke('api/admin', { body: { action, ...params } });
  if (error) {
    let msg = error.message;
    try {
      const body = await error.context?.json();
      if (body?.error) msg = body.error;
    } catch {
      /* not json */
    }
    throw new Error(msg || 'تعذر تنفيذ العملية');
  }
  return data;
}

/* ---------------- data ---------------- */

const listSites = async () => must(await sb.from('sites').select('*').order('name')).map(mapSite);

async function saveSite(id, s) {
  const row = { name: s.name, address: s.address, lat: s.lat, lng: s.lng, radius: s.radius, active: s.active, updated_at: new Date().toISOString() };
  if (id) must(await sb.from('sites').update(row).eq('id', id));
  else must(await sb.from('sites').insert(row));
}
const deleteSite = async (id) => must(await sb.from('sites').delete().eq('id', id));

const listEngineers = async () =>
  must(await sb.from('profiles').select('*').eq('role', 'engineer').order('name')).map(mapEngineer);

async function updateEngineer(id, patch) {
  const row = {};
  if ('name' in patch) row.name = patch.name;
  if ('phone' in patch) row.phone = patch.phone;
  if ('siteIds' in patch) row.site_ids = patch.siteIds;
  if ('deviceId' in patch) row.device_id = patch.deviceId;
  if ('missionsAllowed' in patch) row.missions_allowed = patch.missionsAllowed === true;
  must(await sb.from('profiles').update(row).eq('id', id));
}

const getSettings = async () => mapSettings(must(await sb.from('settings').select('*').eq('id', 1).single()));
const saveSettings = async (s) => must(await sb.from('settings').update(unmapSettings(s)).eq('id', 1));

const getChatIds = async () =>
  must(await sb.from('settings_private').select('telegram_chat_ids').eq('id', 1).single()).telegram_chat_ids || '';
const saveChatIds = async (v) =>
  must(await sb.from('settings_private').update({ telegram_chat_ids: v }).eq('id', 1));

const attendanceOn = async (date) =>
  must(await sb.from('attendance').select('*').eq('date', date)).map(mapAttendance);

async function attendanceRange(from, to) {
  const out = [];
  const page = 1000;
  for (let i = 0; i < 50; i++) {
    const rows = must(
      await sb.from('attendance').select('*').gte('date', from).lte('date', to)
        .order('date').order('check_in_at').range(i * page, i * page + page - 1)
    );
    out.push(...rows);
    if (rows.length < page) break;
  }
  return out.map(mapAttendance);
}

const listAttempts = async (n = 300) =>
  must(await sb.from('attempts').select('*').order('created_at', { ascending: false }).limit(n)).map((r) => ({
    ...r, createdAt: r.created_at,
  }));

/** Missions from `from` (YYYY-MM-DD) on, plus anything still waiting for a decision. */
async function listMissions(from) {
  const [recent, open] = await Promise.all([
    sb.from('missions').select('*').gte('date', from).order('requested_at', { ascending: false }).limit(1000),
    sb.from('missions').select('*').in('status', ['pending', 'approved', 'active']).order('requested_at'),
  ]);
  const byId = new Map();
  [...must(open), ...must(recent)].forEach((r) => byId.set(r.id, r));
  return [...byId.values()].map(mapMission);

/** Accepts "30.04, 31.23", or a Google Maps link containing @lat,lng / q=lat,lng / !3dlat!4dlng */
function parseCoords(text) {
  const t = String(text || '').trim();
  const patterns = [
    /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/,
    /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /[?&](?:q|query|ll)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/,
    /^(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)$/,
  ];
  for (const p of patterns) {
    const m = p.exec(t);
    if (m) {
      const lat = Number(m[1]);
      const lng = Number(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng };
    }
  }
  return null;
}

function openSiteModal(site) {
  const isEdit = !!site;
  const s = site || { name: '', address: '', radius: 150, lat: null, lng: null, active: true };
  let map, marker, circle;

  const m = modal({
    title: isEdit ? `تعديل: ${s.name}` : 'موقع جديد',
    wide: true,
    submitLabel: isEdit ? 'حفظ التعديلات' : 'إضافة الموقع',
    body: `
      <div class="grid-2">
        <div class="field"><label>اسم الموقع *</label><input class="input" name="siteName" value="${esc(s.name)}" required /></div>
        <div class="field"><label>العنوان / وصف</label><input class="input" name="address" value="${esc(s.address || '')}" /></div>
      </div>
      <div class="field">
        <label>مكان الموقع *</label>
        <div class="row">
          <input class="input ltr" name="coords" style="flex:1;min-width:220px" placeholder="الصق إحداثيات أو لينك جوجل ماب: 30.0444, 31.2357"
            value="${s.lat != null ? `${s.lat}, ${s.lng}` : ''}" />
          <button type="button" class="btn" data-here>${icon('pin')} موقعي الحالي</button>
        </div>
        <span class="hint">أو اضغط على الخريطة. من جوجل ماب: اضغط ضغطة طويلة على المكان وانسخ الأرقام اللي بتظهر.</span>
      </div>
      <div class="map" data-map></div>
      <div class="grid-2">
        <div class="field"><label>نصف قطر النطاق (متر) *</label>
          <input class="input ltr" name="radius" type="number" min="30" max="2000" step="10" value="${esc(s.radius)}" /></div>
        <div class="field"><label>الحالة</label>
          <label class="switch"><input type="checkbox" name="active" ${s.active !== false ? 'checked' : ''}/> الموقع نشط ويسمح بالتسجيل</label></div>
      </div>`,
    onOpen: (form) => {
      const mapEl = form.querySelector('[data-map]');
      if (!window.L) {
        mapEl.innerHTML = '<div class="empty">تعذر تحميل الخريطة — استخدم الإحداثيات.</div>';
        return;
      }
      const start = s.lat != null ? [s.lat, s.lng] : CAIRO;
      map = L.map(mapEl).setView(start, s.lat != null ? 16 : 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
      }).addTo(map);
      const place = (lat, lng, pan = true) => {
        const r = Number(form.radius.value) || 150;
        if (!marker) {
          marker = L.marker([lat, lng], { draggable: true }).addTo(map);
          marker.on('dragend', () => {
            const p = marker.getLatLng();

        const c = parseCoords(form.coords.value);

      form.radius.addEventListener('input', () => circle && circle.setRadius(Number(form.radius.value) || 150));

        if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع', 'bad');

          { enableHighAccuracy: true, timeout: 15000 }
        );
      });
      setTimeout(() => map.invalidateSize(), 120);
    },
    onSubmit: async (form) => {
      const name = form.siteName.value.trim();
      const coords = parseCoords(form.coords.value);
      const radius = Math.round(Number(form.radius.value));
      if (name.length < 2) throw new Error('اكتب اسم الموقع.');
      if (!coords) throw new Error('حدد مكان الموقع على الخريطة أو الصق الإحداثيات.');
      if (!(radius >= 30 && radius <= 2000)) throw new Error('النطاق لازم يكون بين 30 و 2000 متر.');
      const data = {
        name,
        address: form.address.value.trim(),
        lat: coords.lat,
        lng: coords.lng,
        radius,
        active: form.active.checked,
      };
      await saveSite(isEdit ? s.id : null, data);
      refresh('sites');
      toast(isEdit ? 'تم حفظ التعديلات' : 'تمت إضافة الموقع', 'ok');
    },
  });
  return m;
}

return { render, parseCoords };
})();

const __m_js_pages_missions = (() => {
const { fn, listMissions, selfieUrl, watch } = __m_js_api;
const { esc, $, badge, fmtDateTime, fmtDuration, fmtTime, icon, modal, toast, todayKey, addDaysKey, MISSION_STATUS, mapsLink } = __m_js_ui;
// المأموريات: requests waiting for the admin's decision, missions running now, and the last 30 days.


function render(page) {
  let rows = [];
  let loaded = false;
  const from = addDaysKey(todayKey(), -30);

  page.innerHTML = `
    <div class="notice">الموظف بيطلب المأمورية من التطبيق ← توافق أو ترفض من هنا ← بعد الموافقة يقدر يبدأها وينهيها من أي مكان بسيلفي وموقعه. كل خطوة بتوصلك على تليجرام.
      المأموريات مفعّلة بس للموظفين اللي معلّم عليهم "مسموح بمأموريات" في صفحة الموظفين.</div>
    <section class="card">
      <div class="card-h"><h3>${icon('car')} طلبات مستنية موافقتك</h3><span id="pendingCount"></span></div>
      <div class="card-b" id="pending"><div class="empty"><span class="spinner"></span></div></div>
    </section>
    <section class="card">
      <div class="card-h"><h3>مأموريات شغالة / متوافق عليها</h3></div>
      <div class="card-b flush table-wrap" id="running"></div>
    </section>
    <section class="card">
      <div class="card-h"><h3>سجل المأموريات (آخر 30 يوم)</h3><span class="muted small" id="total"></span></div>
      <div class="card-b flush table-wrap" id="history"></div>
    </section>`;

  const status = (m) => {
    const [label, kind] = MISSION_STATUS[m.status] || [m.status, ''];
    return badge(label, kind) + (m.flags.includes('no_end') ? ' ' + badge('ماسجلش انتهاء', 'bad') : '');
  };
  const person = (m) => `<td class="person"><b>${esc(m.name)}</b><span class="ltr">${esc(m.code || '')}</span></td>`;
  const where = (p) => (p ? mapsLink(p.lat, p.lng, 'المكان ↗') : '');

  const table = (list, empty) =>
    list.length
      ? `<table class="t"><thead><tr><th>التاريخ</th><th>الموظف</th><th>رايح فين / ليه</th><th>الحالة</th><th>البداية</th><th>النهاية</th><th>المدة</th><th></th></tr></thead><tbody>${list
          .map(
            (m) => `<tr>
          <td class="num">${esc(m.date)}</td>
          ${person(m)}
          <td><b>${esc(m.destination)}</b>${m.purpose ? `<div class="muted small">${esc(m.purpose)}</div>` : ''}
            ${m.decisionNote ? `<div class="small">💬 ${esc(m.decisionNote)}</div>` : ''}</td>
          <td>${status(m)}</td>
          <td class="num">${m.startedAt ? `${fmtTime(m.startedAt)} ${where(m.start)}` : '—'}</td>
          <td class="num">${m.endedAt ? `${fmtTime(m.endedAt)} ${where(m.end)}` : '—'}</td>
          <td class="num">${m.status === 'done' ? fmtDuration(m.durationMinutes) : m.status === 'active' ? 'لسه شغالة' : '—'}</td>
          <td class="actions">${m.start || m.end ? `<button class="btn sm" data-photos="${esc(m.id)}" title="الصور">${icon('camera')}</button>` : ''}</td>
        </tr>`
          )
          .join('')}</tbody></table>`
      : `<div class="empty">${empty}</div>`;

  const draw = () => {
    if (!loaded) return;
    const pending = rows.filter((m) => m.status === 'pending');
    const running = rows.filter((m) => m.status === 'active' || m.status === 'approved');
    const history = rows.filter((m) => !['pending', 'active', 'approved'].includes(m.status));
    $('#pendingCount', page).innerHTML = pending.length ? badge(`${pending.length} طلب`, 'warn') : '';
    $('#pending', page).innerHTML = pending.length
      ? `<div class="mission-list">${pending
          .map(
            (m) => `<div class="mission-card">
          <div class="who"><b>${esc(m.name)} <span class="ltr muted small">${esc(m.code || '')}</span></b>
            <span class="muted small">طلبها ${fmtDateTime(m.requestedAt)}</span></div>
          <div>📍 <b>${esc(m.destination)}</b></div>
          ${m.purpose ? `<div class="muted">📝 ${esc(m.purpose)}</div>` : ''}
          <div class="row">
            <button class="btn primary" data-approve="${esc(m.id)}">${icon('check')} موافقة</button>
            <button class="btn danger" data-reject="${esc(m.id)}">${icon('x')} رفض</button>
          </div></div>`
          )
          .join('')}</div>`
      : `<div class="empty">مفيش طلبات جديدة 👍</div>`;
    $('#running', page).innerHTML = table(running, 'مفيش مأموريات شغالة دلوقتي.');
    $('#history', page).innerHTML = table(history, 'مفيش مأموريات في آخر 30 يوم.');
    const total = history.filter((m) => m.status === 'done').reduce((s, m) => s + (m.durationMinutes || 0), 0);
    $('#total', page).textContent = total ? `إجمالي وقت المأموريات: ${fmtDuration(total)}` : '';
  };

  const decide = (m, approve) =>
    modal({
      title: approve ? `موافقة على مأمورية ${m.name}` : `رفض مأمورية ${m.name}`,
      submitLabel: approve ? 'موافقة' : 'رفض',
      danger: !approve,
      body: `<p style="margin-top:0">📍 <b>${esc(m.destination)}</b>${m.purpose ? `<br><span class="muted">${esc(m.purpose)}</span>` : ''}</p>
        <div class="field"><label>ملاحظة للموظف (اختياري)</label>
          <input class="input" name="note" maxlength="300" placeholder="${approve ? 'مثلاً: ارجع المكتب بعدها' : 'سبب الرفض'}" /></div>`,
      onSubmit: async (form) => {
        await fn('missionDecide', { id: m.id, approve, note: form.note.value.trim() });
        toast(approve ? 'تمت الموافقة' : 'تم الرفض', 'ok');
        load();
      },
    });

  page.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    const find = (id) => rows.find((x) => x.id === id);
    if (b.dataset.approve) decide(find(b.dataset.approve), true);
    if (b.dataset.reject) decide(find(b.dataset.reject), false);
    if (b.dataset.photos) showMissionPhotos(find(b.dataset.photos));
  });

  const load = async () => {
    try {
      rows = await listMissions(from);
      loaded = true;
      draw();
    } catch (err) {
      const msg = /missions/.test(err.message) ? 'جدول المأموريات لسه متعملش في قاعدة البيانات.' : err.message;
      ['#pending', '#running', '#history'].forEach((s) => ($(s, page).innerHTML = `<div class="empty">${esc(msg)}</div>`));
    }
  };
  load();
  const unsub = watch('missions', load);
  const tick = setInterval(draw, 60000);
  return () => {
    unsub();
    clearInterval(tick);
  };
}

async function showMissionPhotos(m) {
  if (!m) return;
  const box = modal({
    title: `مأمورية ${m.name} — ${m.destination}`,
    body: `<div class="selfies">
      <figure><img data-a alt="سيلفي البداية" /><figcaption>${m.startedAt ? `البداية ${fmtTime(m.startedAt)}` : 'لسه ماابتدتش'}</figcaption></figure>
      <figure><img data-b alt="سيلفي النهاية" /><figcaption>${m.endedAt ? `النهاية ${fmtTime(m.endedAt)}` : 'لسه ماخلصتش'}</figcaption></figure>
    </div>`,
  });
  const [a, b] = await Promise.all([selfieUrl(m.start?.selfiePath), selfieUrl(m.end?.selfiePath)]);
  if (a) box.el.querySelector('[data-a]').src = a;
  if (b) box.el.querySelector('[data-b]').src = b;
}

return { render };
})();

// ===== js/pages/reports.js =====
const __m_js_pages_reports = (() => {
const { attendanceRange } = __m_js_api;
const { getState, subscribe } = __m_js_store;
const { esc, $, todayKey, addDaysKey, weekdayOfKey, weekdayIndexOfKey, dateKey, toDate, fmtTime, fmtTime24, fmtDuration, fmtHours, parseHHMM, badge, flagBadges, icon, toast, withBusy, FLAG_LABELS, } = __m_js_ui;
const { showPhotos } = __m_js_pages_today;




function render(page) {
  const today = todayKey();
  const monthStart = `${today.slice(0, 8)}01`;
  let rows = [];
  let result = null;

  page.innerHTML = `
    <section class="card"><div class="card-b">
      <div class="filters">
        <div class="field"><label>من</label><input class="input ltr" type="date" id="from" value="${monthStart}" max="${today}" /></div>
        <div class="field"><label>إلى</label><input class="input ltr" type="date" id="to" value="${today}" max="${today}" /></div>
        <div class="field"><label>المهندس</label><select class="input" id="eng"></select></div>

        <div class="row" style="padding-bottom:2px">
          <button class="btn primary" id="run">${icon('search')} عرض التقرير</button>
          <button class="btn" id="xls" disabled>${icon('download')} تصدير Excel</button>
        </div>
      </div>
      <div class="row small muted" style="margin-top:10px">

        <a href="#" data-range="month">الشهر الحالي</a> ·
        <a href="#" data-range="prev">الشهر اللي فات</a> ·
        <a href="#" data-range="week">آخر 7 أيام</a>
      </div>
    </div></section>
    <section class="card"><div class="card-h"><h3>الملخص لكل مهندس</h3><span class="muted small" id="meta"></span></div>
      <div class="card-b flush table-wrap" id="summary"><div class="empty">اختار الفترة واضغط "عرض التقرير".</div></div></section>
    <section class="card"><div class="card-h"><h3>التفاصيل</h3></div>
      <div class="card-b flush table-wrap" id="detail"></div></section>
    <div class="notice small">الأوفر تايم = ساعات التواجد الزيادة عن اليوم الرسمي (من بداية لنهاية الدوام في الإعدادات)، وكل ساعات أيام الإجازة. الغياب = أيام عمل رسمية بدون أي تسجيل (من تاريخ إنشاء حساب المهندس).</div>`;

  const fillFilters = () => {
    const { engineers, sites } = getState();
    const eSel = $('#eng', page);
    const sSel = $('#site', page);
    const ev = eSel.value;
    const sv = sSel.value;
    eSel.innerHTML = `<option value="">كل المهندسين</option>${engineers.map((e) => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}`;
    sSel.innerHTML = `<option value="">كل المواقع</option>${sites.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}`;
    eSel.value = ev;
    sSel.value = sv;
  };

  page.querySelectorAll('[data-range]').forEach((a) =>
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const kind = a.dataset.range;
      let from = monthStart;
      let to = today;
      if (kind === 'prev') {
        to = addDaysKey(monthStart, -1);
        from = `${to.slice(0, 8)}01`;
      } else if (kind === 'week') {
        from = addDaysKey(today, -6);
      }
      $('#from', page).value = from;
      $('#to', page).value = to;
      run();
    })
  );

  const run = async () => {
    const from = $('#from', page).value;
    const to = $('#to', page).value;
    if (!from || !to || from > to) return toast('راجع الفترة', 'bad');
    await withBusy($('#run', page), async () => {
      rows = await attendanceRange(from, to);
      const eng = $('#eng', page).value;
      const site = $('#site', page).value;
      if (eng) rows = rows.filter((r) => r.uid === eng);
      if (site) rows = rows.filter((r) => r.siteId === site);
      result = compute(rows, from, to, eng, site);
      drawResult(from, to);
      $('#xls', page).disabled = false;
    }).catch((err) => toast(err.message, 'bad'));
  };

  const drawResult = (from, to) => {
    const { summary, workdayCount } = result;
    $('#meta', page).textContent = `${from} ← ${to} · ${workdayCount} يوم عمل رسمي · ${rows.length} تسجيل`;
    $('#summary', page).innerHTML = summary.length
      ? `<table class="t"><thead><tr>
          <th>المهندس</th><th>أيام حضور</th><th>غياب</th><th>أيام تأخير</th><th>إجمالي التأخير</th>
          <th>ساعات التواجد</th><th>أوفر تايم</th><th>أيام إجازة اشتغلها</th><th>بدون انصراف</th>
        </tr></thead><tbody>${summary
          .map(
            (s) => `<tr>
            <td class="person"><b>${esc(s.name)}</b><span class="ltr">${esc(s.code)}</span></td>
            <td class="num">${s.presentDays}</td>
            <td class="num">${s.absentDays == null ? '—' : s.absentDays ? badge(s.absentDays, 'bad') : 0}</td>
            <td class="num">${s.lateDays ? badge(s.lateDays, 'warn') : 0}</td>
            <td class="num">${fmtDuration(s.lateMinutes)}</td>
            <td class="num">${fmtHours(s.totalMinutes)}</td>
            <td class="num">${fmtHours(s.overtimeMinutes)}</td>
            <td class="num">${s.offDaysWorked}</td>
            <td class="num">${s.noCheckout ? badge(s.noCheckout, 'bad') : 0}</td></tr>`
          )
          .join('')}</tbody></table>`
      : `<div class="empty">مفيش بيانات في الفترة دي.</div>`;

    $('#detail', page).innerHTML = rows.length
      ? `<table class="t"><thead><tr>
          <th>التاريخ</th><th>المهندس</th><th>الموقع</th><th>حضور</th><th>انصراف</th><th>المدة</th><th>ملاحظات</th><th></th>
        </tr></thead><tbody>${rows
          .map(
            (r) => `<tr>
            <td class="num">${esc(r.date)}<div class="muted small">${weekdayOfKey(r.date)}</div></td>
            <td class="person"><b>${esc(r.name)}</b><span class="ltr">${esc(r.code)}</span></td>
            <td>${esc(r.siteName)}</td>
            <td class="num">${fmtTime(r.checkInAt)}</td>
            <td class="num">${r.checkOutAt ? fmtTime(r.checkOutAt) : '—'}</td>
            <td class="num">${r.status === 'open' ? badge('في الموقع', 'ok') : fmtDuration(r.durationMinutes)}</td>
            <td>${r.late ? badge(`متأخر ${fmtDuration(r.lateMinutes)}`, 'warn') : ''} ${flagBadges(r.flags)}</td>
            <td class="actions"><button class="btn sm" data-photos="${esc(r.id)}">${icon('camera')}</button></td></tr>`
          )
          .join('')}</tbody></table>`
      : '';
  };

  page.addEventListener('click', (e) => {
    const b = e.target.closest('[data-photos]');
    if (b) showPhotos(rows.find((r) => r.id === b.dataset.photos));
  });
  $('#run', page).addEventListener('click', run);
  $('#xls', page).addEventListener('click', () => exportExcel($('#from', page).value, $('#to', page).value));

  const exportExcel = (from, to) => {
    if (!window.XLSX) return toast('مكتبة Excel لم تُحمّل، تأكد من الإنترنت', 'bad');
    if (!result) return;
    const sum = result.summary.map((s) => ({
      'الكود': s.code,
      'الاسم': s.name,
      'أيام الحضور': s.presentDays,
      'أيام الغياب': s.absentDays ?? '',
      'أيام التأخير': s.lateDays,
      'إجمالي التأخير (دقيقة)': s.lateMinutes,
      'ساعات التواجد': Number(fmtHours(s.totalMinutes)),
      'ساعات أوفر تايم': Number(fmtHours(s.overtimeMinutes)),
      'أيام إجازة اشتغلها': s.offDaysWorked,
      'تسجيلات بدون انصراف': s.noCheckout,
    }));
    const det = rows.map((r) => ({
      'التاريخ': r.date,
      'اليوم': weekdayOfKey(r.date),
      'الكود': r.code,
      'الاسم': r.name,
      'الموقع': r.siteName,
      'وقت الحضور': fmtTime24(r.checkInAt),
      'وقت الانصراف': r.checkOutAt ? fmtTime24(r.checkOutAt) : '',
      'المدة (دقيقة)': r.durationMinutes ?? '',
      'متأخر': r.late ? 'نعم' : '',
      'دقائق التأخير': r.lateMinutes || '',
      'مسافة الحضور (م)': r.checkIn?.distance ?? '',
      'مسافة الانصراف (م)': r.checkOut?.distance ?? '',
      'ملاحظات': (r.flags || []).map((f) => FLAG_LABELS[f]?.[0] || f).join('، '),
    }));
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    const ws1 = XLSX.utils.json_to_sheet(sum);
    const ws2 = XLSX.utils.json_to_sheet(det);
    ws1['!cols'] = Object.keys(sum[0] || { a: 1 }).map((k) => ({ wch: Math.max(12, k.length + 4) }));
    ws2['!cols'] = Object.keys(det[0] || { a: 1 }).map((k) => ({ wch: Math.max(12, k.length + 4) }));
    XLSX.utils.book_append_sheet(wb, ws1, 'ملخص');
    XLSX.utils.book_append_sheet(wb, ws2, 'تفصيلي');
    XLSX.writeFile(wb, `حضور_المواقع_${from}_${to}.xlsx`);
  };

  const unsub = subscribe(fillFilters);
  fillFilters();
  return unsub;
}

/** Aggregates attendance rows into a per-engineer payroll-ready summary. */
function compute(rows, from, to, engFilter, siteFilter) {
  const { engineers, settings } = getState();
  const start = parseHHMM(settings.workStart) ?? 480;
  const end = parseHHMM(settings.workEnd) ?? 1020;
  const standard = Math.max(0, end - start);
  const workDays = settings.workDays || [];
  const lastDay = to < todayKey() ? to : todayKey();

  const workdayKeys = [];
  for (let k = from; k <= lastDay; k = addDaysKey(k, 1)) {
    if (workDays.includes(weekdayIndexOfKey(k))) workdayKeys.push(k);
  }

  const people = new Map();
  const ensure = (uid, name, code) => {
    if (!people.has(uid)) people.set(uid, { uid, name, code, days: new Map(), late: new Map(), noCheckout: 0 });
    return people.get(uid);
  };
  if (!siteFilter) {
    engineers
      .filter((e) => (engFilter ? e.id === engFilter : e.active))
      .forEach((e) => ensure(e.id, e.name, e.code));
  }

  for (const r of rows) {
    const p = ensure(r.uid, r.name, r.code);
    const minutes = r.durationMinutes || 0;
    const d = p.days.get(r.date) || { minutes: 0, nonWorkday: !!r.nonWorkday };
    d.minutes += minutes;
    p.days.set(r.date, d);
    if (r.late) p.late.set(r.date, Math.max(p.late.get(r.date) || 0, r.lateMinutes || 0));
    if (r.status === 'auto_closed' || (r.flags || []).includes('no_checkout')) p.noCheckout += 1;
  }

  const summary = [...people.values()].map((p) => {
    const eng = engineers.find((e) => e.id === p.uid);
    const created = eng?.createdAt ? dateKey(toDate(eng.createdAt)) : from;
    const expected = workdayKeys.filter((k) => k >= created);
    let presentWork = 0;
    let offDaysWorked = 0;
    let totalMinutes = 0;
    let overtimeMinutes = 0;
    for (const [key, d] of p.days) {
      const isWork = workDays.includes(weekdayIndexOfKey(key));
      totalMinutes += d.minutes;
      if (isWork) {
        presentWork += 1;
        overtimeMinutes += Math.max(0, d.minutes - standard);
      } else {
        offDaysWorked += 1;
        overtimeMinutes += d.minutes;
      }
    }
    const absentDays = siteFilter ? null : Math.max(0, expected.length - expected.filter((k) => p.days.has(k)).length);
    return {
      uid: p.uid,
      name: p.name || eng?.name || '—',
      code: p.code || eng?.code || '',
      presentDays: p.days.size,
      presentWork,
      absentDays,
      lateDays: p.late.size,
      lateMinutes: [...p.late.values()].reduce((a, b) => a + b, 0),
      totalMinutes,
      overtimeMinutes,
      offDaysWorked,
      noCheckout: p.noCheckout,
    };
  });
  summary.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ar'));
  return { summary, workdayCount: workdayKeys.length };
}

return { render, compute };
})();

                ${mapsLink(r.lat, r.lng, 'المكان ↗')}</td></tr>`;
          })
          .join('')}</tbody></table>`
      : `<div class="empty">مفيش محاولات مرفوضة 👍</div>`;
  };

  $('#serious', page).addEventListener('change', (e) => {
    onlySerious = e.target.checked;
    draw();
  });

  const load = async () => {
    try {
      rows = await listAttempts(300);
      draw();
    } catch (err) {
      $('#list', page).innerHTML = `<div class="empty">${esc(err.message)}</div>`;
    }
  };
  load();
  return watch('attempts', load);
}

return { render };
})();

const __m_js_pages_settings = (() => {
const { fn, saveSettings, getChatIds, saveChatIds } = __m_js_api;
const { getState, subscribe, refresh } = __m_js_store;
const { esc, $, WEEKDAYS, parseHHMM, toast, withBusy, icon } = __m_js_ui;

    if (parseHHMM(data.workStart) == null || parseHHMM(data.workEnd) == null) return (err.textContent = 'راجع مواعيد الدوام.');

  getChatIds()

  $('#test', page).addEventListener('click', (e) =>
    withBusy(e.currentTarget, async () => {
      await keepChatIds();
      const { results } = await fn('telegramTest');
      const failed = results.filter((r) => !r.ok);
      if (failed.length) toast(`فشل الإرسال لـ ${failed.map((f) => f.chatId).join(', ')}: ${failed[0].error}`, 'bad');
      else toast('تم إرسال رسالة التجربة ✅', 'ok');

  $('#discover', page).addEventListener('click', (e) =>
    withBusy(e.currentTarget, async () => {
      const { chats } = await fn('telegramDiscover');
      const box = $('#chats', page);
      if (!chats.length) {
        box.innerHTML = `<div class="notice warn">مفيش محادثات. ابعت /start للبوت الأول وحاول تاني.</div>`;
        return;
      }
      box.innerHTML = `<div class="checks">${chats
        .map(
          (c) => `<button type="button" class="check" data-add="${esc(c.id)}">${icon('plus')} ${esc(c.title || c.id)}
          <span class="muted small ltr">${esc(c.id)}</span></button>`
        )
        .join('')}</div>`;

  $('#chats', page).addEventListener('click', (e) => {

// ===== js/app.js =====
{
const { configured, fn, isAdmin, onAuth, signIn, signOut, resetPasswordEmail, setNewPassword, pendingMissionsCount, watch } = __m_js_api;
const { esc, icon, toast, modal, $ } = __m_js_ui;
const { startStore, stopStore, getState, subscribe } = __m_js_store;
const today = __m_js_pages_today;
const sites = __m_js_pages_sites;
const engineers = __m_js_pages_engineers;
const missions = __m_js_pages_missions;
const reports = __m_js_pages_reports;
const security = __m_js_pages_security;
const settings = __m_js_pages_settings;










const ROUTES = {
  today: { title: 'لوحة اليوم', icon: 'today', page: today },
  sites: { title: 'المواقع', icon: 'site', page: sites },
  engineers: { title: 'الموظفين', icon: 'users', page: engineers },
  missions: { title: 'المأموريات', icon: 'car', page: missions },
  reports: { title: 'التقارير', icon: 'report', page: reports },
  security: { title: 'سجل الأمان', icon: 'shield', page: security },
  settings: { title: 'الإعدادات', icon: 'settings', page: settings },
};

const root = document.getElementById('app');
let cleanup = null;
let currentUser = null;
let bootedFor = null;

const brandMark = `<div class="brand-mark"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2.5a7 7 0 0 0-7 7c0 5.3 7 12 7 12s7-6.7 7-12a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg></div>`;

/* ---------------- screens ---------------- */

function renderNotConfigured() {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      ${brandMark}
      <h1>لوحة التحكم غير مربوطة بعد</h1>
      <p>افتح الملف <code class="k">admin/js/config.js</code> وحط فيه Project URL والـ anon key بتوع مشروع Supabase.</p>
      <div class="notice">الخطوات بالتفصيل في <b>docs/SETUP_AR.md</b>.</div>
    </div></div>`;
}

function renderLogin() {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap">
      <form class="auth-card" id="login" novalidate>
        ${brandMark}
        <h1>نظام حضور المواقع</h1>
        <p>تسجيل دخول الإدارة</p>
        <div class="field"><label for="email">البريد الإلكتروني</label>
          <input class="input ltr" id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="password">كلمة السر</label>
          <input class="input ltr" id="password" type="password" autocomplete="current-password" required /></div>
        <div class="form-error" id="err"></div>
        <button class="btn primary block" type="submit">دخول</button>
        <div style="margin-top:14px;text-align:center"><a href="#" id="forgot" class="small">نسيت كلمة السر؟</a></div>
      </form>
    </div>`;
  const form = $('#login');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    $('#err').textContent = '';
    btn.disabled = true;
    try {
      await signIn($('#email').value.trim(), $('#password').value);
    } catch (err) {
      $('#err').textContent = authError(err);
    } finally {
      btn.disabled = false;
    }
  });
  $('#forgot').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    if (!email) return ($('#err').textContent = 'اكتب الإيميل الأول.');
    try {
      await resetPasswordEmail(email);
      toast('لو الإيميل مسجل، هيوصلك رابط لتغيير كلمة السر', 'ok');
    } catch (err) {
      $('#err').textContent = err.message;
    }
  });
}

function renderNotAdmin(user) {
  root.className = '';
  root.innerHTML = `
    <div class="auth-wrap"><div class="auth-card">
      ${brandMark}
      <h1>الحساب ده مش مدير</h1>
      <p class="ltr" style="text-align:right">${esc(user.email || '')}</p>
      <div class="notice" style="margin-bottom:16px">لو دي أول مرة تشغّل النظام، اضغط الزر تحت علشان تتفعّل كأول مدير. الزر بيشتغل مرة واحدة بس، وبعدها أي مدير جديد يتضاف من الإعدادات.</div>
      <div class="form-error" id="err"></div>
      <button class="btn primary block" id="boot">تفعيل كأول مدير</button>
      <button class="btn block" id="out" style="margin-top:10px">تسجيل خروج</button>
    </div></div>`;
  $('#boot').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {
      await fn('bootstrap');
      toast('تم تفعيلك كمدير', 'ok');
      bootedFor = null;
      await boot(user);
    } catch (err) {
      $('#err').textContent = err.message;
      e.target.disabled = false;
    }
  });
  $('#out').addEventListener('click', () => signOut());
}

function renderShell(user) {
  root.className = '';
  root.innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">${brandMark}<div><b>حضور المواقع</b><span id="companyName"></span></div></div>
        <nav class="nav">
          ${Object.entries(ROUTES)
            .map(([k, r]) => `<a href="#/${k}" data-route="${k}">${icon(r.icon)}<span>${r.title}</span>${k === 'missions' ? '<b class="count" id="missionsCount"></b>' : ''}</a>`)
            .join('')}
        </nav>
        <div class="foot">كل الأوقات بتوقيت القاهرة</div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h2 id="pageTitle"></h2>
          <div class="who"><span class="ltr">${esc(user.email || '')}</span>
            <button class="btn sm" id="logout">${icon('logout')} خروج</button></div>
        </header>
        <main class="content" id="page"></main>
      </div>
    </div>`;
  $('#logout').addEventListener('click', () => signOut());
  const setCompany = () => {
    const el = $('#companyName');
    if (el) el.textContent = getState().settings.companyName || '';
  };
  if (!renderShell.subscribed) {
    subscribe(setCompany);
    renderShell.subscribed = true;
  }
  setCompany();
}

function route() {
  if (!currentUser || !$('#page')) return;
  const key = (location.hash.replace(/^#\/?/, '') || 'today').split('?')[0];
  const r = ROUTES[key] || ROUTES.today;
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.route === key));
  $('#pageTitle').textContent = r.title;
  document.title = `${r.title} — حضور المواقع`;
  if (typeof cleanup === 'function') cleanup();
  cleanup = null;
  // Fresh element per route so page-level event listeners never accumulate.
  const old = $('#page');
  const page = old.cloneNode(false);
  old.replaceWith(page);
  try {
    cleanup = r.page.render(page);
  } catch (err) {
    console.error(err);
    page.innerHTML = `<div class="card card-b">حصل خطأ أثناء تحميل الصفحة: ${esc(err.message)}</div>`;
  }
}

function authError(err) {
  const msg = String(err?.message || '').toLowerCase();
  if (msg.includes('invalid login') || msg.includes('invalid credentials')) return 'الإيميل أو كلمة السر غلط.';
  if (msg.includes('email not confirmed')) return 'الإيميل لسه متأكدش. فعّله من Supabase → Authentication.';
  if (msg.includes('rate') || msg.includes('too many')) return 'محاولات كتير. استنى شوية وحاول تاني.';
  if (msg.includes('fetch') || msg.includes('network')) return 'مشكلة في الاتصال بالإنترنت.';
  return 'تعذر تسجيل الدخول.';
}

async function boot(user) {
  if (bootedFor === user.id) return; // token refreshes fire auth events too
  bootedFor = user.id;
  if (!(await isAdmin(user.id))) {
    currentUser = null;
    return renderNotAdmin(user);
  }
  currentUser = user;
  renderShell(user);
  startStore();
  route();
  watchPendingMissions();
}

// Red counter next to "المأموريات" in the sidebar = requests waiting for a decision.
let stopPending = null;
function watchPendingMissions() {
  if (stopPending) stopPending();
  const update = async () => {
    const el = $('#missionsCount');
    if (el) el.textContent = (await pendingMissionsCount()) || '';
  };
  update();
  stopPending = watch('missions', update);
}

function askNewPassword() {
  modal({
    title: 'كلمة سر جديدة',
    submitLabel: 'حفظ',
    body: `<div class="field"><label>كلمة السر الجديدة (8 حروف على الأقل)</label>
      <input class="input ltr" name="pw" type="password" autocomplete="new-password" /></div>`,
    onSubmit: async (form) => {
      if (form.pw.value.length < 8) throw new Error('كلمة السر قصيرة.');
      await setNewPassword(form.pw.value);
      toast('تم تغيير كلمة السر', 'ok');
    },
  });
}

window.addEventListener('hashchange', route);

if (!configured) {
  renderNotConfigured();
} else {
  onAuth((user, event) => {
    if (event === 'PASSWORD_RECOVERY') setTimeout(askNewPassword, 300);
    if (!user) {
      if (typeof cleanup === 'function') cleanup();
      cleanup = null;
      currentUser = null;
      bootedFor = null;
      stopStore();
      if (stopPending) stopPending();
      stopPending = null;
      return renderLogin();
    }
    // Don't await inside the auth callback (supabase-js recommendation).
    setTimeout(() => boot(user).catch((err) => {
      console.error(err);
      bootedFor = null;
      toast('تعذر تحميل الحساب', 'bad');
    }), 0);
  });
}

}
</script>
</body>
</html>
